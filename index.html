  G.me.energy -= src.active.energy;
  doReflect(src, null, G.en, "상대", "en");
  sel={hand:null,attacker:null,mode:null};
  if(checkEnd())return; renderBattle();
}

// ===== 납 축적독 =====
// 독 걸기 (공용). 이전 대상의 독은 사라짐
function markLead(src, tgt, defP){
  defP.field.forEach(t=>{ if(t.leadBy===src.iid){ t.leadStacks=0; t.leadTick=0; t.leadBy=null; } });
  tgt.leadBy = src.iid; tgt.leadStacks = 1; tgt.leadTick = 0;
  src.leadTarget = tgt.iid; src.leadTurn = G.turnCount;
  SFX.poison();
}
function leadTarget(iid){
  if(G.turn!=="me"||busy||sel.mode!=="lead") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  const tgt = G.en.field.find(c=>c.iid===iid);
  if(!src||!tgt) return;
  if(tgt.passive?.kind==="immune"){ toast("금에는 독이 안 통해요"); return; }
  if(src.leadTarget===tgt.iid){ toast("이미 독을 쌓고 있는 상대예요"); return; }
  if(src.active.energy > G.me.energy){ toast("에너지가 부족해요"); sel={hand:null,attacker:null,mode:null}; renderBattle(); return; }
  G.me.energy -= src.active.energy;
  markLead(src, tgt, G.en);
  fx(`☠️ ${elName(tgt.name)}에 축적독!`, "#94a3b8");
  log(`☠️ ${src.name} 축적독! ${tgt.name}에게 독이 쌓이기 시작해요`);
  sel={hand:null,attacker:null,mode:null}; renderBattle();
}
// 턴 시작에 독 피해: 쌓인 만큼 아프고, 2턴마다 1씩 더 쌓임 (최대치 없음)
// atkField = 납이 있는 쪽 필드, defP = 독 걸린 쪽
function applyLead(atkField, defP, defName){
  let any=false;
  defP.field.forEach(t=>{
    if(!(t.leadStacks>0)) return;
    if(!atkField.some(p=>p.iid===t.leadBy)){ t.leadStacks=0; t.leadTick=0; t.leadBy=null; return; } // 납이 죽으면 독 끝
    t.curHp -= t.leadStacks; any=true;
    log(`☠️ ${defName}의 ${t.name} 축적독 ${t.leadStacks} 피해`);
    t.leadTick = (t.leadTick||0) + 1;
    if(t.leadTick >= 2){ t.leadTick = 0; t.leadStacks += 1; }
  });
  if(!any) return false;
  fx(`☠️ 축적독!`, "#94a3b8"); SFX.poison();
  const dead = defP.field.filter(t=>t.curHp<=0);
  dead.forEach(t=>{ log(`☠️ ${defName}의 ${t.name}이(가) 축적독으로 쓰러졌어요!`); onCardDeath(t, defP, null); });
  defP.field = defP.field.filter(t=>t.curHp>0);
  return true;
}

// ===== 아인슈타이늄 수소폭탄 =====
// 수소가 상대를 공격하면: 이번 턴 동안 손패의 아인슈타이늄 한 장을 공짜로 소환 가능
function hbombTrigger(owner, ownerName){
  if(owner.hbombReady) return;
  if(!owner.hand.some(c=>c.passive?.kind==="hbomb")) return;
  owner.hbombReady = true;
  log(`💣 수소폭탄! ${ownerName==="당신"?"이번 턴에 아인슈타이늄을 공짜로 소환할 수 있어요":"상대가 아인슈타이늄을 공짜로 부를 수 있게 됐어요"}`);
  setTimeout(()=>{ fx(`💣 수소폭탄! 아인슈타이늄 무료!`, "#a3e635"); SFX.explode(); }, 350);
}

// 인 발화: 상대 대상 클릭
function blastTarget(iid){
  if(G.turn!=="me"||busy||sel.mode!=="blast") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  const tgt = G.en.field.find(c=>c.iid===iid);
  if(!src||!tgt) return;
  // 발화도 도발(철) 지킴 — 철 있으면 철부터
  if(!tauntTargets(G.en.field).map(x=>x.iid).includes(iid)){ toast("자석 방패! 철을 먼저 노려야 해요 🧲"); return; }
  if(src.active.energy > G.me.energy){ toast("에너지가 부족해요"); sel={hand:null,attacker:null,mode:null}; renderBattle(); return; }
  G.me.energy -= src.active.energy;
  src.usedActive = true;
  const dmg = src.active.value;
  fx(`🔥 ${elName(src.name)} 발화!`, "#fb923c"); SFX.explode();
  log(`🔥 ${src.name} 발화! ${tgt.name}에게 ${dmg} 피해`);
  const before = tgt.curHp; tgt.curHp -= dmg;
  if(tgt.curHp<=0){
    if(tgt.passive?.kind==="lastStand" && !tgt.lastStandUsed){
      tgt.lastStandUsed=true; tgt.curHp=1;
      log(`✨ 불활성! ${tgt.name}이(가) 버텼어요`);
    } else {
      log(`☠️ 상대의 ${tgt.name} 파괴됨!`);
      onCardDeath(tgt, G.en, src);
      G.en.field = G.en.field.filter(c=>c.iid!==tgt.iid);
      const overflow = boronReduce(dmg - before, G.en.field);
      if(overflow>0){ G.en.hp -= overflow; log(`➡️ 관통! 넘친 ${overflow} 데미지가 본체로`); }
    }
  }
  sel={hand:null,attacker:null,mode:null};
  if(checkEnd())return; renderBattle();
}

// 인 발화: 본체 직접 (상대 카드 없을 때)
function blastFace(){
  if(G.turn!=="me"||busy||sel.mode!=="blast") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  if(!src) return;
  if(G.en.field.length>0){ toast("상대 카드를 먼저 없애야 해요"); return; }
  if(src.active.energy > G.me.energy){ toast("에너지가 부족해요"); sel={hand:null,attacker:null,mode:null}; renderBattle(); return; }
  G.me.energy -= src.active.energy;
  src.usedActive = true;
  const dmg = src.active.value;
  G.en.hp -= dmg;
  fx(`🔥 본체에 발화 ${dmg}!`, "#fb923c"); SFX.explode();
  log(`🔥 ${src.name} 발화! 상대 본체에 ${dmg} 피해`);
  setTimeout(()=>flashHp("en"), 60);
  sel={hand:null,attacker:null,mode:null};
  if(checkEnd())return; renderBattle();
}

// 해당 필드(공격자 진영)에 독을 켠 염소가 살아있는지 → 상대가 중독 상태인지
function poisonActive(attackerField){
  return attackerField.some(c=>c.poisonOn && c.active?.kind==="poison");
}
// 중독 데미지 적용: defField(중독된 쪽) 카드들이 1씩 깎임, 금은 면역
function applyPoison(atkField, defP, defName, defSide){
  if(!poisonActive(atkField)) return;
  const dmg = 1;
  const hit = [];
  defP.field.forEach(t=>{
    if(t.passive?.kind==="immune"){ return; } // 금 면역
    t.curHp -= dmg; hit.push(t.name);
  });
  const dead = defP.field.filter(t=>t.curHp<=0);
  dead.forEach(t=>log(`☠️ ${defName}의 ${t.name}이(가) 중독으로 쓰러졌어요!`));
  defP.field = defP.field.filter(t=>t.curHp>0);
  if(hit.length){ fx(`☠️ 독 데미지!`, "#4ade80"); SFX.poison(); }
}

// 방사능 오염 데미지: 오염된 카드가 매턴 2씩, 3턴. side의 필드 처리
function applyRadiation(P, sideName, sideKey){
  let any=false;
  P.field.forEach(t=>{
    if(t.radTurns > 0){
      t.curHp -= 2; t.radTurns -= 1; any=true;
      if(t.curHp < 0){                    // 카드 체력 넘겨 깎임 = 관통
        const others = P.field.filter(c=>c.iid!==t.iid); // 죽는 카드 자신은 제외
        const overflow = boronReduce(-t.curHp, others);
        if(overflow>0){
          P.hp -= overflow;
          log(`➡️ 관통! 넘친 방사능 ${overflow}이(가) 본체로`);
        }
      }
    }
  });
  if(any){ fx(`☢️ 방사능 피해!`, "#a3e635"); }
  // 오염으로 죽은 카드 처리 (죽으면 남은 피해 본체로) — fx 나중에 떠서 안 덮임
  const dead = P.field.filter(t=>t.curHp<=0);
  dead.forEach(t=>{
    log(`☢️ ${sideName}의 ${t.name}이(가) 방사능으로 쓰러졌어요!`);
    onCardDeath(t, P, null);
  });
  P.field = P.field.filter(t=>t.curHp>0);
}

// ============================================================
// 턴 진행
// ============================================================
async function endTurn(){
  if(G.turn!=="me"||busy) return;
  { const b = tutoBlock("endTurn"); if(b){ toast(b); return; } }
  sel={hand:null,attacker:null,mode:null}; G.me.hbombReady=false; log("— 당신의 턴 종료 —");
  G.turn="en"; busy=true; renderBattle();
  fx("상대 턴", "#ef4444");
  try{
    await enemyTurn();
  }catch(err){
    // 봇 턴 중 에러가 나도 멈추지 않고 내 턴으로 복구
    console.error("봇 턴 오류:", err);
    if(G){
      G.me.maxEnergy = Math.min(MAX_ENERGY, G.me.maxEnergy+1); G.me.energy = G.me.maxEnergy;
      drawFor(G.me, "당신");
      G.me.field.forEach(c=>{ c.canAttack=true; c.hasAttacked=false; c.flashStunned=false; });
      G.turn="me"; G.turnCount++; busy=false;
      renderBattle();
    }
  }
}

// ============================================================
// 친구 대결 전용 봇 (개선 AI). 스테이지 봇(enemyTurn)과 완전 분리.
// ============================================================
async function versusEnemyTurn(){
  // 턴 시작 피해 처리 (스테이지 봇과 동일)
  if(poisonActive(G.me.field)){
    applyPoison(G.me.field, G.en, "상대", "en");
    renderBattle(); if(checkEnd()) return; await wait(600); if(!G) return;
  }
  if(applyLead(G.me.field, G.en, "상대")){
    renderBattle(); if(checkEnd()) return; await wait(600); if(!G) return;
  }
  applyRadiation(G.en, "상대", "en");
  renderBattle(); if(checkEnd()) return;
  G.en.maxEnergy = Math.min(MAX_ENERGY, G.en.maxEnergy+1); G.en.energy = G.en.maxEnergy;
  drawFor(G.en, "상대");
  G.en.field.forEach(c=>{
    if(c.flashStunned){ c.canAttack=false; c.hasAttacked=true; c.flashStunned=false; }
    else { c.canAttack=true; c.hasAttacked=false; }
  });
  renderBattle(); await wait(500);
  if(!G) return;

  const score = c => (c.atk||0) + (c.hp||0);           // "센 카드" 기준
  const alive = () => G.en.field;                        // 내(봇) 필드
  const foes  = () => G.me.field;                        // 상대(플레이어) 필드

  // --- 리튬 방출: 방출하면 못 내던 카드를 낼 수 있게 될 때만 (소환보다 먼저) ---
  const liList = alive().filter(c=>c.active?.kind==="battery" && !c.batteryDone && (c.charge||0)>0);
  for(const li of liList){
    if(!G) return;
    const after = G.en.energy + li.charge;
    const canAfford = rc => rc<=after;
    const cantNow   = rc => rc>G.en.energy;
    const worth = G.en.hand.some(h=>{ const rc=costOf(h,alive()); return cantNow(rc) && canAfford(rc); });
    if(worth){
      await wait(400); if(!G) return;
      G.en.energy += li.charge; li.charge=0; li.batteryDone=true;
      log(`🔋 상대 ${li.name} 방출! 에너지 획득`);
      fx(`🔋 상대 ${elName(li.name)} 방출!`, "#fbbf24");
      renderBattle();
    }
  }

  // --- 소환 ---
  let guard=0;
  while(guard++<12){
    if(!G) return;
    if(alive().length>=FIELD_MAX) break;
    const playable = G.en.hand.map(c=>({c,rc:costOf(c,alive())})).filter(x=>x.rc<=G.en.energy);
    if(!playable.length) break;

    const fieldEmpty = alive().length===0;
    const hasAttacker = alive().some(c=>c.canAttack && !c.hasAttacked && (c.atk||0)>0);
    // 칼슘(boneUp)·질소(shield)는 아군이 이미 있을 때만. 단 필드 비었고 낼 게 이것뿐이면 예외
    const condOnly = x => x.c.passive?.kind==="boneUp" || x.c.passive?.kind==="shield";
    let pool = playable.filter(x=>!condOnly(x) || !fieldEmpty);
    if(!pool.length) pool = playable; // 낼 게 조건부 카드뿐이면 그거라도

    let pick=null;
    const byKey = k => pool.filter(x=>x.c.key===k).sort((a,b)=>b.rc-a.rc)[0];
    if(fieldEmpty){
      // 필드 비면 무조건 뭐라도 — 센 카드 우선
      pick = [...pool].sort((a,b)=>score(b.c)-score(a.c))[0];
    } else if(G.en.energy>=4 && byKey("C")){
      pick = byKey("C");                                 // 탄소 먼저
    } else if(hasAttacker && byKey("O")){
      pick = byKey("O");                                 // 공격할 카드 있으면 산소 먼저
    } else {
      pick = [...pool].sort((a,b)=>score(b.c)-score(a.c))[0]; // 센 카드부터 (철도 섞여 들어감)
    }
    if(!pick) break;

    const {c,rc}=pick; G.en.energy-=rc;
    G.en.hand = G.en.hand.filter(x=>x.iid!==c.iid);
    const bcard = {...c, canAttack:false, hasAttacked:false};
    alive().push(bcard);
    log(`🔶 상대가 ${c.name}(${c.symbol}) 소환!`);
    onSummon(bcard, G.en);
    renderBattle(); await wait(500);
  }
  if(!G) return;

  // --- 소듐(aoe): 상대 카드 3장 이상일 때 ---
  for(const na of alive().filter(c=>c.active?.kind==="aoe" && !c.usedActive && c.canAttack)){
    if(!G) return;
    if(foes().length>=3 && na.active.energy<=G.en.energy){
      await wait(500); if(!G) return;
      G.en.energy -= na.active.energy; na.usedActive=true;
      fx(`💥 상대 ${elName(na.name)} 물 폭발!`, "#fb923c"); SFX.explode();
      log(`💥 상대 ${na.name} 물 폭발! 당신 전체에 ${na.active.value} 데미지`);
      foes().forEach(t=>{ t.curHp -= na.active.value; if(t.curHp<=0) log(`☠️ 당신의 ${t.name} 파괴됨!`); });
      G.me.field = foes().filter(t=>t.curHp>0);
      renderBattle(); if(checkEnd()) return;
    }
  }
  // --- 마그네슘(stun): 상대 카드 3장 이상일 때 ---
  for(const mg of alive().filter(c=>c.active?.kind==="stun" && !c.usedActive && c.canAttack)){
    if(!G) return;
    if(foes().length>=3 && mg.active.energy<=G.en.energy){
      await wait(500); if(!G) return;
      G.en.energy -= mg.active.energy; mg.usedActive=true;
      foes().forEach(t=>{ t.flashStunned=true; });
      fx(`✨ 상대 ${elName(mg.name)} 섬광!`, "#facc15"); SFX.explode();
      log(`✨ 상대 ${mg.name} 섬광! 당신 카드 전체가 다음 턴 공격할 수 없어요`);
      renderBattle();
    }
  }
  // --- 염소(poison): 상대 카드 2장 이상, 아직 독 안 깔림 ---
  for(const cl of alive().filter(c=>c.active?.kind==="poison" && !c.usedActive && c.canAttack)){
    if(!G) return;
    if(foes().length>=2 && !poisonActive(alive()) && cl.active.energy<=G.en.energy){
      await wait(500); if(!G) return;
      G.en.energy -= cl.active.energy; cl.usedActive=true; cl.poisonOn=true;
      fx(`☠️ 상대 ${elName(cl.name)} 독가스!`, "#4ade80"); SFX.poison();
      log(`☠️ 상대 ${cl.name} 독가스! 당신 전체가 매 턴 중독돼요`);
      renderBattle();
    }
  }
  // --- 인(blast): 체력 높은 카드가 4 이상이면 그 카드, 카드 없고 본체 12 이하면 본체 ---
  for(const p of alive().filter(c=>c.active?.kind==="blast" && !c.usedActive && c.canAttack)){
    if(!G) return;
    if(p.active.energy>G.en.energy) continue;
    const dmg = p.active.value;
    const pool = tauntTargets(foes());
    const topHp = pool.length ? pool.reduce((a,b)=>b.curHp>a.curHp?b:a) : null;
    if(topHp && topHp.curHp>=4){
      await wait(500); if(!G) return;
      G.en.energy -= p.active.energy; p.usedActive=true;
      fx(`🔥 상대 ${elName(p.name)} 발화!`, "#fb923c"); SFX.explode();
      log(`🔥 상대 ${p.name} 발화! ${topHp.name}에게 ${dmg} 피해`);
      const before=topHp.curHp; topHp.curHp-=dmg;
      if(topHp.curHp<=0){
        if(topHp.passive?.kind==="lastStand" && !topHp.lastStandUsed){ topHp.lastStandUsed=true; topHp.curHp=1; }
        else { onCardDeath(topHp,G.me,p); G.me.field=foes().filter(x=>x.iid!==topHp.iid); const of=boronReduce(dmg-before,G.me.field); if(of>0)G.me.hp-=of; }
      }
      renderBattle(); if(checkEnd()) return;
    } else if(foes().length===0 && G.me.hp<=12){
      await wait(500); if(!G) return;
      G.en.energy -= p.active.energy; p.usedActive=true;
      G.me.hp -= dmg;
      fx(`🔥 상대 발화! 본체 ${dmg}!`, "#fb923c"); SFX.explode();
      log(`🔥 상대 ${p.name} 발화! 당신 본체에 ${dmg} 피해`);
      flashHp("me"); renderBattle(); if(checkEnd()) return;
    }
    // 둘 다 아니면 아껴둠
  }
  // --- 납(leadPoison): 기존 규칙 그대로 (체력 높은 카드, 금 제외, 대상 죽기 전 재사용 X) ---
  for(const pb of alive().filter(c=>c.active?.kind==="leadPoison" && c.canAttack && c.leadTurn!==G.turnCount)){
    if(!G) return;
    if(pb.active.energy>G.en.energy) continue;
    if(foes().some(t=>t.iid===pb.leadTarget)) continue;
    const pool = foes().filter(t=>t.passive?.kind!=="immune");
    if(!pool.length) continue;
    const tgt = pool.reduce((a,b)=>b.curHp>a.curHp?b:a);
    await wait(500); if(!G) return;
    G.en.energy -= pb.active.energy;
    markLead(pb, tgt, G.me);
    fx(`☠️ 상대 축적독! ${elName(tgt.name)}`, "#94a3b8");
    log(`☠️ 상대 ${pb.name} 축적독! 당신의 ${tgt.name}에게 독이 쌓이기 시작해요`);
    renderBattle();
  }
  // --- 은(reflect): 은 체력 1일 때(죽기 직전), 모은 피해 2 이상 + 에너지 충분 ---
  syncReflect();
  for(const ag of alive().filter(c=>c.active?.kind==="reflect" && c.canAttack && c.reflectTurn!==G.turnCount)){
    if(!G) return;
    const st = ag.reflectStore||0;
    if(ag.curHp!==1 || st<2 || ag.active.energy>G.en.energy) continue;
    await wait(500); if(!G) return;
    G.en.energy -= ag.active.energy;
    const pool = tauntTargets(foes());
    if(pool.length>0){
      const killable = pool.filter(t=>t.curHp<=st);
      const tgt = killable.length ? killable.reduce((a,b)=>b.curHp>a.curHp?b:a)
                                  : pool.reduce((a,b)=>b.curHp>a.curHp?b:a);
      doReflect(ag, tgt, G.me, "당신", "me");
    } else {
      doReflect(ag, null, G.me, "당신", "me");
    }
    renderBattle(); if(checkEnd()) return;
  }
  // --- 포타슘(heal): 다친 아군 중 체력 제일 낮은 것(동점이면 공격력 높은 것) ---
  for(const k of alive().filter(c=>c.active?.kind==="heal" && c.canAttack)){
    if(!G) return;
    if(k.active.energy>G.en.energy) continue;
    const hurt = alive().filter(t=>t.curHp < (t.maxHp||t.hp));
    if(!hurt.length) continue;
    const tgt = hurt.reduce((a,b)=>{
      if(b.curHp!==a.curHp) return b.curHp<a.curHp?b:a;
      return (b.atk||0)>(a.atk||0)?b:a;
    });
    await wait(400); if(!G) return;
    G.en.energy -= k.active.energy;
    tgt.curHp = Math.min(tgt.maxHp||tgt.hp, tgt.curHp + k.active.value);
    log(`💚 상대 ${k.name} 회복! ${tgt.name} 체력 회복`);
    fx(`💚 상대 ${elName(tgt.name)} 회복!`, "#4ade80");
    renderBattle();
  }

  // --- 공격 ---
  const attackers = alive().filter(c=>c.canAttack && !c.hasAttacked);
  for(const aCard of attackers){
    if(!G) return; await wait(550);
    const live = alive().find(c=>c.iid===aCard.iid); if(!live||live.hasAttacked) continue;
    if(foes().length===0){
      const dmg = effAtk(live, alive()); G.me.hp -= dmg;
      log(`💥 상대 ${live.name} → 당신 본체에 ${dmg} 데미지! (남은 ${Math.max(0,G.me.hp)})`);
      fx(`💥 내 본체에 ${dmg}!`, "#ef4444"); SFX.pierce();
      renderBattle(); flashHp("me");
    } else if(live.passive?.kind==="infiltrate"){
      const dmg = effAtk(live, alive()); G.me.hp -= dmg;
      log(`🩸 상대 ${live.name}이(가) 방어를 뚫고 본체에 ${dmg} 데미지!`);
      fx(`🩸 침투! 본체에 ${dmg}!`, "#c084fc"); SFX.pierce();
      renderBattle(); flashHp("me");
    } else {
      const pool = tauntTargets(foes());
      const dmg = effAtk(live, alive());
      const canKill = t => { const sh=shieldFor(t,foes()); return (dmg-sh)>=t.curHp; };
      let tCard=null;
      // 1) 한 방에 죽일 수 있는 적 (여럿이면 체력 높은 것 — 알짜부터)
      const killable = pool.filter(canKill);
      if(killable.length){ tCard = killable.reduce((a,b)=>b.curHp>a.curHp?b:a); }
      // 2) 지원 카드(산소·질소·탄소) 먼저
      if(!tCard){ const sup = pool.filter(t=>t.passive?.kind==="allyAtkUp"||t.passive?.kind==="shield"||t.passive?.kind==="costDown"); if(sup.length) tCard=sup[0]; }
      // 3) 공격력 높은 적
      if(!tCard){ tCard = [...pool].sort((a,b)=>(b.atk||0)-(a.atk||0))[0]; }
      // 패시브 고려: 헬륨(불활성) 아직 안 쓴 카드엔 "한 방에 못 죽이면" 안 몰아주기
      // → 더 나은 대상이 있으면 그쪽으로
      if(tCard && tCard.passive?.kind==="lastStand" && !tCard.lastStandUsed && !canKill(tCard)){
        const alt = pool.filter(t=>t.iid!==tCard.iid);
        if(alt.length){
          const altKill = alt.filter(canKill);
          tCard = altKill.length ? altKill.reduce((a,b)=>b.curHp>a.curHp?b:a)
                                 : [...alt].sort((a,b)=>(b.atk||0)-(a.atk||0))[0];
        }
      }
      if(!tCard){
        const d2 = effAtk(live, alive()); G.me.hp -= d2;
        log(`💥 상대 ${live.name} → 당신 본체에 ${d2} 데미지!`);
        fx(`💥 내 본체에 ${d2}!`, "#ef4444"); SFX.pierce();
        renderBattle(); flashHp("me");
      } else {
        fx(`⚔️ 상대 ${elName(live.name)} 공격!`, "#e0662f");
        dealToUnit(live, tCard, alive(), G.me, "당신", "me");
        renderBattle();
      }
    }
    live.hasAttacked=true;
    if(live.key==="H" && G) hbombTrigger(G.en, "상대");
    renderBattle();
    if(checkEnd()) return;
  }
  // 수소폭탄 무료 소환
  if(G && G.en.hbombReady && alive().length<FIELD_MAX){
    const es = G.en.hand.find(c=>c.passive?.kind==="hbomb");
    if(es){
      await wait(500); if(!G) return;
      G.en.hand = G.en.hand.filter(c=>c.iid!==es.iid);
      const nc = {...es, canAttack:false, hasAttacked:false};
      alive().push(nc);
      log(`🔶 상대가 ${es.name}(${es.symbol}) 소환! (수소폭탄으로 무료)`);
      fx(`💣 상대 ${elName(es.name)} 무료 소환!`, "#a3e635");
      onSummon(nc, G.en); renderBattle();
    }
  }
  if(G) G.en.hbombReady = false;
  await wait(600);
  if(!G) return;
  // 턴 종료 → 내 턴 (스테이지 봇과 동일)
  log("— 상대 턴 종료 —");
  G.me.maxEnergy = Math.min(MAX_ENERGY, G.me.maxEnergy+1); G.me.energy = G.me.maxEnergy;
  drawFor(G.me, "당신");
  G.me.field.forEach(c=>{
    if(c.flashStunned){ c.canAttack=false; c.hasAttacked=true; c.flashStunned=false; }
    else { c.canAttack=true; c.hasAttacked=false; }
  });
  G.turn="me"; G.turnCount++; busy=false;
  G.me.field.forEach(c=>{
    if(c.active?.kind==="battery" && !c.batteryDone){
      c.chargeTick = (c.chargeTick||0) + 1;
      if(c.chargeTick >= 2){ c.chargeTick = 0; c.charge = Math.min(3, (c.charge||0) + 1); }
    }
  });
  log(`🔵 당신의 턴 ${G.turnCount}! (에너지 ⚡${G.me.maxEnergy})`);
  renderBattle();
  fx("내 턴!", "#3b82f6");
  if(poisonActive(G.en.field)){
    setTimeout(()=>{ if(!G || G.turn!=="me") return; applyPoison(G.en.field, G.me, "당신", "me"); renderBattle(); checkEnd(); }, 700);
  }
  setTimeout(()=>{ if(!G || G.turn!=="me") return; if(applyLead(G.en.field, G.me, "당신")){ renderBattle(); checkEnd(); } }, 720);
  setTimeout(()=>{ if(!G || G.turn!=="me") return; applyRadiation(G.me, "당신", "me"); renderBattle(); checkEnd(); }, 740);
}

async function enemyTurn(){
  await wait(700);
  if(!G) return;
  // === 튜토리얼 전용 봇 (봐주기) ===
  if(G.tutorial){
    await tutoEnemyTurn();
    return;
  }
  // === 친구 대결 전용 봇 (개선된 AI) — 스테이지 봇은 아래 기존 로직 그대로 ===
  if(G.versus){
    await versusEnemyTurn();
    return;
  }
  // 상대 턴 시작: 상대 카드가 중독됐으면(내 염소가 독 켬) 데미지
  if(poisonActive(G.me.field)){
    applyPoison(G.me.field, G.en, "상대", "en");
    renderBattle();
    if(checkEnd()) return;
    await wait(600);
    if(!G) return;
  }
  // 상대 카드 축적독 (내 납)
  if(applyLead(G.me.field, G.en, "상대")){
    renderBattle();
    if(checkEnd()) return;
    await wait(600);
    if(!G) return;
  }
  // 상대 카드 방사능 오염 피해
  applyRadiation(G.en, "상대", "en");
  renderBattle();
  if(checkEnd()) return;
  G.en.maxEnergy = Math.min(MAX_ENERGY, G.en.maxEnergy+1); G.en.energy = G.en.maxEnergy;
  drawFor(G.en, "상대");
  G.en.field.forEach(c=>{
    if(c.flashStunned){ c.canAttack=false; c.hasAttacked=true; c.flashStunned=false; }
    else { c.canAttack=true; c.hasAttacked=false; }
  });
  renderBattle(); await wait(500);
  if(!G) return;

  let guard=0;
  while(guard++<12){
    if(!G) return;
    if(G.en.field.length>=FIELD_MAX) break;
    let playable = G.en.hand.map(c=>({c,rc:costOf(c,G.en.field)})).filter(x=>x.rc<=G.en.energy).sort((a,b)=>b.rc-a.rc);
    if(!playable.length) break;
    const {c,rc}=playable[0]; G.en.energy-=rc;
    G.en.hand = G.en.hand.filter(x=>x.iid!==c.iid);
    const bcard = {...c, canAttack:false, hasAttacked:false};
    G.en.field.push(bcard);
    log(`🔶 상대가 ${c.name}(${c.symbol}) 소환!`);
    onSummon(bcard, G.en);
    renderBattle(); await wait(500);
  }
  if(!G) return;

  // 봇 나트륨 액티브: 내 카드가 2개 이상이고 실수 안 할 때 발동
  const botMiss = G.botMiss || 0.5;
  const naField = G.en.field.filter(c=>c.active?.kind==="aoe" && !c.usedActive && c.canAttack);
  for(const na of naField){
    if(!G) return;
    if(G.me.field.length>=2 && na.active.energy<=G.en.energy){
      await wait(500);
      if(!G) return;
      G.en.energy -= na.active.energy; na.usedActive=true;
      fx(`💥 상대 ${elName(na.name)} 물 폭발!`, "#fb923c"); SFX.explode();
      log(`💥 상대 ${na.name} 물 폭발! 당신 전체에 ${na.active.value} 데미지`);
      G.me.field.forEach(t=>{ t.curHp -= na.active.value; if(t.curHp<=0) log(`☠️ 당신의 ${t.name} 파괴됨!`); });
      G.me.field = G.me.field.filter(t=>t.curHp>0);
      renderBattle();
      if(checkEnd()) return;
    }
  }

  // 봇 마그네슘 섬광: 내 카드가 2개 이상일 때 전체 스턴
  const mgField = G.en.field.filter(c=>c.active?.kind==="stun" && !c.usedActive && c.canAttack);
  for(const mg of mgField){
    if(!G) return;
    if(G.me.field.length>=2 && mg.active.energy<=G.en.energy){
      await wait(500);
      if(!G) return;
      G.en.energy -= mg.active.energy; mg.usedActive=true;
      G.me.field.forEach(t=>{ t.flashStunned=true; });
      fx(`✨ 상대 ${elName(mg.name)} 섬광!`, "#facc15"); SFX.explode();
      log(`✨ 상대 ${mg.name} 섬광! 당신 카드 전체가 다음 턴 공격할 수 없어요`);
      renderBattle();
    }
  }

  // 봇 염소 액티브: 내 카드가 1개 이상, 독 안 깔렸고, 실수 안 할 때
  const clField = G.en.field.filter(c=>c.active?.kind==="poison" && !c.usedActive && c.canAttack);
  for(const cl of clField){
    if(!G) return;
    if(G.me.field.length>=1 && !poisonActive(G.en.field) && cl.active.energy<=G.en.energy){
      await wait(500);
      if(!G) return;
      G.en.energy -= cl.active.energy; cl.usedActive=true; cl.poisonOn=true;
      fx(`☠️ 상대 ${elName(cl.name)} 독가스!`, "#4ade80"); SFX.poison();
      log(`☠️ 상대 ${cl.name} 독가스! 당신 전체가 매 턴 중독돼요`);
      renderBattle();
    }
  }

  // 봇 리튬 방출: 충전 있으면 방출해서 에너지 확보 (센 카드 내려고)
  const liField = G.en.field.filter(c=>c.active?.kind==="battery" && !c.batteryDone && (c.charge||0)>0);
  for(const li of liField){
    if(!G) return;
    {
      await wait(400);
      if(!G) return;
      G.en.energy += li.charge; li.charge=0; li.batteryDone=true;
      log(`🔋 상대 ${li.name} 방출! 에너지 획득`);
      fx(`🔋 상대 ${elName(li.name)} 방출!`, "#fbbf24");
      renderBattle();
    }
  }

  // 봇 인 발화: 가장 위협적인 내 카드(체력 높은 것) 저격, 없으면 본체
  const pField = G.en.field.filter(c=>c.active?.kind==="blast" && !c.usedActive && c.canAttack);
  for(const p of pField){
    if(!G) return;
    if(p.active.energy<=G.en.energy){
      await wait(500);
      if(!G) return;
      const dmg = p.active.value;
      // 도발 있으면 도발부터, 아니면 체력 높은 카드, 카드 없으면 본체
      const pool = tauntTargets(G.me.field);
      if(pool.length>0){
        let tgt = pool.reduce((a,b)=>b.curHp>a.curHp?b:a);
        G.en.energy -= p.active.energy; p.usedActive=true;
        fx(`🔥 상대 ${elName(p.name)} 발화!`, "#fb923c"); SFX.explode();
        log(`🔥 상대 ${p.name} 발화! ${tgt.name}에게 ${dmg} 피해`);
        const before=tgt.curHp; tgt.curHp-=dmg;
        if(tgt.curHp<=0){
          if(tgt.passive?.kind==="lastStand" && !tgt.lastStandUsed){ tgt.lastStandUsed=true; tgt.curHp=1; }
          else { onCardDeath(tgt,G.me,p); G.me.field=G.me.field.filter(x=>x.iid!==tgt.iid); const of=boronReduce(dmg-before,G.me.field); if(of>0)G.me.hp-=of; }
        }
      } else {
        G.en.energy -= p.active.energy; p.usedActive=true;
        G.me.hp -= dmg;
        fx(`🔥 상대 발화! 본체 ${dmg}!`, "#fb923c"); SFX.explode();
        log(`🔥 상대 ${p.name} 발화! 당신 본체에 ${dmg} 피해`);
        flashHp("me");
      }
      renderBattle();
      if(checkEnd()) return;
    }
  }

  // 봇 납 축적독: 독 걸린 대상이 없으면 내 카드 중 체력 높은 것에 (금 제외)
  const pbField = G.en.field.filter(c=>c.active?.kind==="leadPoison" && c.canAttack && c.leadTurn!==G.turnCount);
  for(const pb of pbField){
    if(!G) return;
    if(pb.active.energy>G.en.energy) continue;
    if(G.me.field.some(t=>t.iid===pb.leadTarget)) continue; // 이미 독 쌓는 중
    const pool = G.me.field.filter(t=>t.passive?.kind!=="immune");
    if(!pool.length) continue;
    const tgt = pool.reduce((a,b)=>b.curHp>a.curHp?b:a);
    await wait(500);
    if(!G) return;
    G.en.energy -= pb.active.energy;
    markLead(pb, tgt, G.me);
    fx(`☠️ 상대 축적독! ${elName(tgt.name)}`, "#94a3b8");
    log(`☠️ 상대 ${pb.name} 축적독! 당신의 ${tgt.name}에게 독이 쌓이기 시작해요`);
    renderBattle();
  }

  // 봇 은 반사: 모은 피해가 2 이상이면 방출 (잡을 수 있는 카드 우선, 없으면 체력 높은 카드, 카드 없으면 본체)
  syncReflect();
  const agField = G.en.field.filter(c=>c.active?.kind==="reflect" && c.canAttack && c.reflectTurn!==G.turnCount);
  for(const ag of agField){
    if(!G) return;
    const st = ag.reflectStore||0;
    if(st<2 || ag.active.energy>G.en.energy) continue;
    await wait(500);
    if(!G) return;
    G.en.energy -= ag.active.energy;
    const pool = tauntTargets(G.me.field);
    if(pool.length>0){
      const killable = pool.filter(t=>t.curHp<=st);
      const tgt = killable.length ? killable.reduce((a,b)=>b.curHp>a.curHp?b:a) : pool.reduce((a,b)=>b.curHp>a.curHp?b:a);
      doReflect(ag, tgt, G.me, "당신", "me");
    } else {
      doReflect(ag, null, G.me, "당신", "me");
    }
    renderBattle();
    if(checkEnd()) return;
  }

  // 봇 칼륨 회복: 다친 아군이 있으면 회복
  const kField = G.en.field.filter(c=>c.active?.kind==="heal" && c.canAttack);
  for(const k of kField){
    if(!G) return;
    if(k.active.energy<=G.en.energy){
      const hurt = G.en.field.filter(t=>t.curHp < (t.maxHp||t.hp));
      if(hurt.length>0){
        const tgt = hurt.reduce((a,b)=> (a.maxHp||a.hp)-a.curHp > (b.maxHp||b.hp)-b.curHp ? a:b); // 제일 많이 다친
        await wait(400);
        if(!G) return;
        G.en.energy -= k.active.energy;
        tgt.curHp = Math.min(tgt.maxHp||tgt.hp, tgt.curHp + k.active.value);
        log(`💚 상대 ${k.name} 회복! ${tgt.name} 체력 회복`);
        fx(`💚 상대 ${elName(tgt.name)} 회복!`, "#4ade80");
        renderBattle();
      }
    }
  }

  const attackers = G.en.field.filter(c=>c.canAttack && !c.hasAttacked);
  for(const aCard of attackers){
    if(!G) return; await wait(550);
    const live = G.en.field.find(c=>c.iid===aCard.iid); if(!live||live.hasAttacked) continue;
    if(G.me.field.length===0){
      const dmg = effAtk(live, G.en.field); G.me.hp -= dmg;
      log(`💥 상대 ${live.name} → 당신 본체에 ${dmg} 데미지! (남은 ${Math.max(0,G.me.hp)})`);
      fx(`💥 내 본체에 ${dmg}!`, "#ef4444"); SFX.pierce();
      renderBattle(); flashHp("me");
    } else if(live.passive?.kind==="infiltrate"){
      // 수은 침투: 도발 무시하고 본체 직접 (7스테 컨셉)
      const dmg = effAtk(live, G.en.field); G.me.hp -= dmg;
      log(`🩸 상대 ${live.name}이(가) 방어를 뚫고 본체에 ${dmg} 데미지!`);
      fx(`🩸 침투! 본체에 ${dmg}!`, "#c084fc"); SFX.pierce();
      renderBattle(); flashHp("me");
    } else {
      // 도발 우선, 그 안에서 대상 선택
      const pool = tauntTargets(G.me.field);
      let tCard;
      if(Math.random() < botMiss){
        tCard = pool[0];
      } else {
        const dmg = effAtk(live, G.en.field);
        const killable = pool.filter(t=>{ const sh=shieldFor(t,G.me.field); return (dmg-sh)>=t.curHp; });
        const buffers = pool.filter(t=>t.passive?.kind==="allyAtkUp"||t.passive?.kind==="shield"||t.passive?.kind==="costDown");
        if(killable.length){ killable.sort((a,b)=>b.curHp-a.curHp); tCard=killable[0]; }
        else if(buffers.length){ tCard=buffers[0]; }
        else { tCard=[...pool].sort((a,b)=>a.curHp-b.curHp)[0]; }
      }
      // 안전장치: 대상이 없으면(필드가 방금 비었으면) 본체 공격
      if(!tCard){
        const dmg = effAtk(live, G.en.field); G.me.hp -= dmg;
        log(`💥 상대 ${live.name} → 당신 본체에 ${dmg} 데미지!`);
        fx(`💥 내 본체에 ${dmg}!`, "#ef4444"); SFX.pierce();
        renderBattle(); flashHp("me");
      } else {
        fx(`⚔️ 상대 ${elName(live.name)} 공격!`, "#e0662f");
        dealToUnit(live, tCard, G.en.field, G.me, "당신", "me");
        renderBattle();
      }
    }
    live.hasAttacked=true;
    if(live.key==="H" && G) hbombTrigger(G.en, "상대");
    renderBattle();
    if(checkEnd()) return;
  }
  // 봇 수소폭탄: 수소가 공격했으면 아인슈타이늄 무료 소환
  if(G && G.en.hbombReady && G.en.field.length<FIELD_MAX){
    const es = G.en.hand.find(c=>c.passive?.kind==="hbomb");
    if(es){
      await wait(500);
      if(!G) return;
      G.en.hand = G.en.hand.filter(c=>c.iid!==es.iid);
      const nc = {...es, canAttack:false, hasAttacked:false};
      G.en.field.push(nc);
      log(`🔶 상대가 ${es.name}(${es.symbol}) 소환! (수소폭탄으로 무료)`);
      fx(`💣 상대 ${elName(es.name)} 무료 소환!`, "#a3e635");
      onSummon(nc, G.en);
      renderBattle();
    }
  }
  if(G) G.en.hbombReady = false;
  await wait(600);
  if(!G) return;
  log("— 상대 턴 종료 —");
  G.me.maxEnergy = Math.min(MAX_ENERGY, G.me.maxEnergy+1); G.me.energy = G.me.maxEnergy;
  drawFor(G.me, "당신");
  G.me.field.forEach(c=>{
    if(c.flashStunned){ c.canAttack=false; c.hasAttacked=true; c.flashStunned=false; }
    else { c.canAttack=true; c.hasAttacked=false; }
  });
  G.turn="me"; G.turnCount++; busy=false;
  // 리튬 충전: 내 필드의 리튬이 2턴마다 +1 (최대 3), 방출한 리튬은 충전 안 함
  G.me.field.forEach(c=>{
    if(c.active?.kind==="battery" && !c.batteryDone){
      c.chargeTick = (c.chargeTick||0) + 1;
      if(c.chargeTick >= 2){
        c.chargeTick = 0;
        c.charge = Math.min(3, (c.charge||0) + 1);
      }
    }
  });
  log(`🔵 당신의 턴 ${G.turnCount}! (에너지 ⚡${G.me.maxEnergy})`);
  renderBattle();
  fx("내 턴!", "#3b82f6");
  // 내 턴 시작: 내 카드가 중독됐으면(상대 염소가 독 켬) 데미지
  if(poisonActive(G.en.field)){
    setTimeout(()=>{
      if(!G || G.turn!=="me") return;
      applyPoison(G.en.field, G.me, "당신", "me");
      renderBattle();
      checkEnd();
    }, 700);
  }
  // 내 카드 축적독 (상대 납)
  setTimeout(()=>{
    if(!G || G.turn!=="me") return;
    if(applyLead(G.en.field, G.me, "당신")){ renderBattle(); checkEnd(); }
  }, 720);
  // 내 카드 방사능 오염 피해
  setTimeout(()=>{
    if(!G || G.turn!=="me") return;
    applyRadiation(G.me, "당신", "me");
    renderBattle();
    checkEnd();
  }, 750);
}

function drawFor(p, who){
  if(p.deck.length===0){
    if(G && G.tutorial){
      p.deck = (who==="당신") ? buildDeck(["H","O","N"]) : buildDeck(["H","O","N"]); // 튜토리얼은 기본 카드로 다시 채움(모아둔 카드 없음)
    } else {
      p.deck = (who==="당신") ? buildPlayerDeck() : buildDeck(STAGES[stage].deck);
    }
    log(`🔄 ${who} 덱을 다시 섞었어요`);
  }
  const card = p.deck.shift();
  if(card){ if(p.hand.length<HAND_MAX) p.hand.push(card); else log(`✋ ${who} 손패가 가득 차 카드를 버렸어요`); }
}

// ============================================================
// 승패
// ============================================================
function checkEnd(){
  if(!G) return false;
  if(G.en.hp<=0){
    if(G.tutorial){ finishTutorial(false); return true; }
    if(G.versus){ showVersusWin(); return true; }
    // 보스 1페이즈 클리어 → 가짜 클리어 화면 (로비 누르면 2페이즈)
    if(G.boss && G.bossPhase===1){ showBossFakeClear(); return true; }
    showResult(true); return true;
  }
  if(G.me.hp<=0){
    if(G.tutorial){ return false; }
    if(G.versus){ showVersusLose(); return true; }
    showResult(false); return true;
  }
  return false;
}
// 친구 대결 승리 → 인증 화면 (코드 + 내 덱 + 턴 수)
function showVersusWin(){
  busy=true;
  fx("🎉 승리!", "#22c55e"); SFX.win();
  const code = G.versusCode;
  const turns = G.turnCount;
  const myKeys = activeDeckKeys();
  const myChips = myKeys.map(k=>chipHTML(k)).join("");
  G=null;
  setTimeout(()=>{
    document.getElementById("app").innerHTML = `<div id="result">
      <h1>🏆 대결 승리!</h1>
      <div class="win-cert">
        <div style="font-size:15px;font-weight:800;color:#a78bfa;">"${code}" 덱을 이겼어요!</div>
        <div style="font-size:13px;color:var(--ink-soft);margin:8px 0;">⏱️ ${turns}턴 만에 승리</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:10px;">내 덱</div>
        <div class="win-deck">${myChips}</div>
      </div>
      <p class="subtitle" style="font-size:12px;">화면을 캡처해서 자랑하세요! 📸</p>
      <div style="margin-top:16px; display:flex; gap:10px; justify-content:center;">
        <button class="btn-primary" onclick="showVersus()">또 대결</button>
        <button class="btn-ghost" onclick="showTitle()">로비로</button></div>
    </div>`;
  }, 900);
}
// 친구 대결 패배
function showVersusLose(){
  busy=true;
  fx("💀 패배...", "#ef4444"); SFX.lose();
  const code = G.versusCode;
  G=null;
  setTimeout(()=>{
    document.getElementById("app").innerHTML = `<div id="result">
      <h1>💀 패배...</h1>
      <p class="subtitle">"${code}" 덱에게 졌어요.<br>덱을 바꿔서 다시 도전해보세요!</p>
      <div style="margin-top:16px; display:flex; gap:10px; justify-content:center;">
        <button class="btn-primary" onclick="showEnterCode()">다시 도전</button>
        <button class="btn-ghost" onclick="showTitle()">로비로</button></div>
    </div>`;
  }, 900);
}
function showResult(win){
  busy=true;
  fx(win?"🎉 승리!":"💀 패배...", win?"#22c55e":"#ef4444"); if(win) SFX.win(); else SFX.lose();
  const st = STAGES[stage];
  const isFinal = stage >= MAX_STAGE;
  const isReview = stage < maxStage;    // 도전 스테이지가 최대 진도보다 낮으면 복습판
  const reviewStage = stage;

  // 승리 시 코인 지급 (첫 클리어 vs 반복)
  let moleGain = 0;
  let justUnlockedGacha = false;
  let bossReward = false;
  const firstClear = win && !clearedStages[stage];
  if(win){
    moleGain = firstClear ? (STAGE_MOLE[stage]||100) : (STAGE_MOLE_REPEAT[stage]||80);
    mole += moleGain;
    clearedStages[stage] = true;
    if(!gachaUnlocked){ gachaUnlocked = true; justUnlockedGacha = true; }
    // 보스(10스테) 첫 클리어 → 우라늄 지급
    if(st.boss && !owned.includes("U")){ owned.push("U"); bossReward=true; }
    saveGame();
  }

  // 보상 후보 중 아직 안 가진 것
  const rewardPool = (win && st.reward) ? st.reward.filter(k=>!owned.includes(k)) : [];

  G=null;
  setTimeout(()=>{
    const moleMsg = moleGain>0 ? `<div style="color:#5eead4;font-size:14px;font-weight:800;margin:8px 0;">🪙 코인 +${moleGain} (보유 ${mole})</div>` : "";
    const unlockMsg = justUnlockedGacha ? `<div class="unlock-banner">🎰 <b>뽑기가 열렸어요!</b><br><span style="font-size:12px;font-weight:400;">로비에서 코인으로 새 원소를 뽑을 수 있어요.<br>같은 원소가 나오면 💎 에너지 결정으로 바뀌고, 20개를 모으면 원하는 원소로 바꿀 수 있어요!</span></div>` : "";
    const isFinalStage = stage >= MAX_STAGE;
    // 복습판(stage<maxStage): 다시하기 / 로비로
    // 일반 진행 판: 다음 스테이지 / 다시하기
    let choiceBtns;
    if(isReview){
      choiceBtns = `<div style="margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn-primary" onclick="startBattle()">다시 하기 🔄</button>
        <button class="btn-ghost" onclick="showTitle()">로비로</button></div>`;
    } else {
      const nextBtn = isFinalStage
        ? `<button class="btn-ghost" onclick="showTitle()">로비로 →</button>`
        : `<button class="btn-primary" onclick="goNextStage()">다음 스테이지 →</button>`;
      choiceBtns = `<div style="margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        ${nextBtn}<button class="btn-ghost" onclick="startBattle()">다시 하기 🔄</button></div>`;
    }

    if(win && rewardPool.length >= 2){
      // 택1 보상 (카드 고르면 다음 진행)
      const cards = rewardPool.map(k=>{
        const e=ELEMENTS[k];
        const desc = e.passive ? e.passive.label : (e.active ? e.active.label : "특별한 능력이 없어요");
        const skillName = e.passive ? ('✨ '+e.passive.short) : (e.active ? ('💥 '+e.active.short) : '능력 없음');
        return `<div class="reward-pick" onclick="pickReward('${k}')">
          ${chipHTML(k)}
          <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">⚡${e.cost} · ⚔${e.atk} · ❤${e.hp}</div>
          <div style="font-size:11px;color:#9be3c4;margin-top:4px;font-weight:700;">${skillName}</div>
          <div class="reward-desc">${desc}</div>
        </div>`;
      }).join("");
      document.getElementById("app").innerHTML = `<div id="result"><h1>🎉 스테이지 클리어!</h1>
        ${moleMsg}${unlockMsg}
        <p class="subtitle">보상을 하나 골라요! (하나만 받을 수 있어요)</p>
        <div class="reward-choices">${cards}</div>
        <div class="ver">v0.23</div></div>`;
    } else if(win && rewardPool.length === 1){
      // 단일 보상 + 다시/다음
      owned.push(rewardPool[0]); saveGame();
      const e=ELEMENTS[rewardPool[0]];
      const rewardHTML = `<div class="reward-box"><div style="color:var(--ink-soft);margin-bottom:10px;">새 원소 카드 획득! 🎁</div>
        <div style="display:flex;justify-content:center;">${chipHTML(rewardPool[0])}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:10px;">⚡${e.cost} · ⚔${e.atk} · ❤${e.hp}${e.passive?` · ✨${e.passive.short}`:(e.active?` · 💥${e.active.short}`:"")}</div></div>`;
      document.getElementById("app").innerHTML = `<div id="result"><h1>🎉 스테이지 클리어!</h1>
        ${rewardHTML}${moleMsg}${unlockMsg}
        ${choiceBtns}
        <div class="ver">v0.23</div></div>`;
    } else if(win && isFinalStage && firstClear){
      // 보스 첫 클리어 = 축하 + 우라늄
      const uReward = bossReward ? `<div class="reward-box"><div style="color:var(--ink-soft);margin-bottom:10px;">☢️ 전설의 원소 획득!</div>
        <div style="display:flex;justify-content:center;">${chipHTML("U")}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:10px;">⚡4 · ⚔1 · ❤4 · ☢️방사능 오염</div></div>` : "";
      document.getElementById("app").innerHTML = `<div id="result"><h1>🏆 보스 격파!</h1>
        <p class="subtitle">보스를 물리쳤어요! 축하합니다! 🎉<br>이제 여기서 코인을 벌며 원소를 모아봐요</p>
        ${uReward}${moleMsg}${unlockMsg}
        <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
          <button class="btn-primary" onclick="startBattle()">다시 하기 🔄</button>
          <button class="btn-ghost" onclick="showTitle()">로비로 →</button></div>
        <div class="ver">v0.23</div></div>`;
    } else if(win){
      // 보상 없음 (반복 클리어 등) + 다시/다음
      document.getElementById("app").innerHTML = `<div id="result"><h1>🎉 ${isFinalStage?"승리!":"스테이지 클리어!"}</h1>
        ${moleMsg}${unlockMsg}
        ${choiceBtns}
        <div class="ver">v0.23</div></div>`;
    } else {
      // 패배
      document.getElementById("app").innerHTML = `<div id="result"><h1>💀 패배...</h1>
        <p class="subtitle">${st.label}에 다시 도전해보세요!</p>
        <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
          <button class="btn-primary" onclick="startBattle()">다시 도전 🔄</button>
          <button class="btn-ghost" onclick="showTitle()">로비로</button></div>
        <div class="ver">v0.23</div></div>`;
    }
  }, 900);
}

// 택1 보상 선택: 복습판이면 stage 그대로 두고 로비로, 일반 진행이면 다음 스테이지로
function pickReward(key){
  if(!owned.includes(key)){ owned.push(key); saveGame(); }
  SFX.summon();
  if(stage < maxStage){ saveGame(); showTitle(); }  // 복습판: 다음으로 넘어가지 않음
  else goNextStage();
}
// 다음 스테이지로 (로비를 거침 - 덱/뽑기 손볼 기회)
function goNextStage(){
  if(stage < MAX_STAGE){ stage++; }
  if(stage > maxStage) maxStage = stage;  // 진행도 갱신
  saveGame();
  showTitle();
}

function nextStage(){
  if(stage < MAX_STAGE){ stage++; }
  if(stage > maxStage) maxStage = stage;
  saveGame();
  showTitle();
}
function resetGame(){
  stage = 1; maxStage = 1;
  owned = ["H","O","N","C"];
  deckKeys = null;
  mole = 0; crystal = 0; gachaUnlocked = false; clearedStages = {}; gachaCount = 0;
  tutoDone = false; tutoStep = 0;
  hideTutoGuide();
  clearSave();
  slideIdx = 0;
  renderTutorial();  // 초기화하면 튜토리얼(슬라이드)부터 다시
}

// 전투 중 나가기 (화면 확인 방식)
function confirmExit(){
  if(G.turn!=="me"||busy){ toast("상대 턴에는 나갈 수 없어요"); return; }
  document.getElementById("app").innerHTML = `
    <div style="text-align:center; padding-top:50px;">
      <h1 style="font-size:26px;">🚪 전투 나가기</h1>
      <div class="settings-box" style="text-align:center;">
        <div style="font-size:15px; line-height:1.7;">정말 로비로 나갈까요?</div>
        <div style="font-size:13px; color:var(--ink-soft); margin-top:6px;">지금 전투는 무효가 되고,<br>다시 하면 처음부터예요</div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
        <button class="btn-danger" onclick="doExit()">나가기</button>
        <button class="btn-primary" onclick="renderBattle()">계속하기</button>
      </div>
    </div>`;
}
function doExit(){
  G = null;
  busy = false;
  sel = { hand:null, attacker:null, mode:null };
  showTitle();
}

// ---------- 시작 ----------
const hasSave = loadGame();
if(hasSave){
  showTitle();   // 이어하기: 바로 로비로
} else {
  renderTutorial();  // 새 게임: 튜토리얼부터
}
</script>
