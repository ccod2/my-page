<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 원소카드게임</title>
<style>
  :root{
    --bg:#151a24; --panel:#1e2532; --ink:#e4e8f0; --ink-soft:#98a2b8; --line:#2e3646;
    --me:#5b9bf7; --me-soft:#22344f; --en:#f4757a; --en-soft:#3d2530;
    --gold:#f5c344; --hp:#4ade80;
    --shadow:0 2px 8px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.24);
    --shadow-lg:0 10px 28px rgba(0,0,0,.42);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; padding:14px; user-select:none;
  }
  #app{ max-width:1040px; margin:0 auto; }
  h1{ font-size:38px; text-align:center; letter-spacing:-.5px; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn-primary{ background:var(--me); color:#fff; border-radius:12px; padding:13px 30px; font-size:16px; font-weight:800; box-shadow:var(--shadow); transition:transform .08s, box-shadow .15s; }
  .btn-primary:hover{ box-shadow:var(--shadow-lg); }
  .btn-primary:active{ transform:scale(.97); }
  .btn-danger{ background:var(--en); color:#fff; border-radius:11px; padding:10px 20px; font-size:14px; font-weight:800; box-shadow:var(--shadow); }
  .btn-active{ background:#fb923c; color:#2a1400; border-radius:11px; padding:10px 20px; font-size:14px; font-weight:800; box-shadow:var(--shadow); }
  .btn-active:active{ transform:scale(.97); }
  .btn-ghost{ background:var(--panel); color:var(--ink); border:1.5px solid var(--line); border-radius:11px; padding:11px 20px; font-size:14px; font-weight:700; }
  .btn-locked{ background:transparent; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:11px; padding:11px 20px; font-size:14px; font-weight:700; opacity:.7; }
  .lobby-menu{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px; }
  .lobby-menu .menu-main .btn-primary{ font-size:17px; padding:14px 34px; }
  .lobby-menu .menu-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn-ghost:hover{ border-color:#c3cad6; }
  .btn-disabled{ background:#e6e9f0; color:#a6adbd; border-radius:12px; padding:13px 30px; font-size:16px; font-weight:800; cursor:not-allowed; }
  .hidden{ display:none !important; }

  /* ---------- 튜토리얼 ---------- */
  #tutorial{ text-align:center; padding-top:8px; }
  .slide-card{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:30px 22px; max-width:480px; margin:18px auto; min-height:330px; display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow); }
  .slide-emoji{ font-size:62px; margin-bottom:16px; }
  .slide-title{ font-size:23px; font-weight:800; margin-bottom:12px; color:var(--me); }
  .slide-body{ font-size:15.5px; line-height:1.75; color:#c4cbdb; }
  .slide-visual{ font-size:25px; margin:16px 0 0; line-height:1.5; background:#151a24; border-radius:12px; padding:14px; }
  .dots{ display:flex; gap:8px; justify-content:center; margin:16px 0; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#cfd6e2; transition:background .2s; }
  .dot.active{ background:var(--me); }
  .tut-nav{ display:flex; gap:10px; justify-content:center; }

  /* ---------- 타이틀 ---------- */
  .subtitle{ color:var(--ink-soft); margin:8px 0 26px; font-size:15px; }
  .owned-box{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; max-width:560px; margin:0 auto 22px; text-align:left; box-shadow:var(--shadow); }
  .owned-box b{ font-size:15px; }
  .chips{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; justify-content:center; }

  /* ---------- 전투 레이아웃 ---------- */
  .zone{ border-radius:16px; padding:10px 12px; transition:box-shadow .3s, background .3s; position:relative; }
  .zone.en{ background:#191f2b; }
  .zone.me{ background:#191f2b; }
  .zone.active-en{ box-shadow:0 0 0 2.5px var(--en), 0 0 20px rgba(244,117,122,.35); background:#241a20; }
  .zone.active-me{ box-shadow:0 0 0 2.5px var(--me), 0 0 20px rgba(91,155,247,.35); background:#1a2436; }

  .pbar{ display:flex; align-items:center; gap:12px; padding:4px 4px 8px; }
  .pbar .who{ font-weight:800; min-width:44px; font-size:15px; }
  .pbar .who.en{ color:var(--en); }
  .pbar .who.me{ color:var(--me); }
  .hpwrap{ flex:1; height:24px; background:#0e121a; border-radius:12px; overflow:hidden; position:relative; box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
  .hpfill{ height:100%; border-radius:12px; transition:width .5s cubic-bezier(.22,1,.36,1); }
  .hpfill.hit{ animation:hpflash .4s; }
  @keyframes hpflash{ 0%{ filter:brightness(1.7); } 100%{ filter:brightness(1); } }
  .hptext{ position:absolute; inset:0; text-align:center; font-size:13px; line-height:24px; font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .stat-mini{ font-size:13px; font-weight:700; }
  .stat-mini.e{ color:var(--gold); }
  .stat-mini.d{ color:var(--ink-soft); }

  .field-label{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 4px; font-weight:600; }
  .stage-bar{ display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:800; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .exit-btn{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; }
  .exit-btn:hover{ color:var(--en); border-color:var(--en); }
  .field-row{ display:flex; gap:10px; min-height:132px; align-items:center; flex-wrap:wrap; }
  .field-row.poison-fog{ background:rgba(74,222,128,.14); border-radius:12px; box-shadow:inset 0 0 20px rgba(74,222,128,.18); }
  .empty{ color:#aab2c2; font-size:13px; font-style:italic; padding:36px 10px; }

  .mid{ text-align:center; padding:6px 0; position:relative; min-height:20px; }

  /* ---------- 카드 (주기율표 칸 스타일) ---------- */
  .card{
    width:92px; height:120px; border-radius:12px; background:var(--panel);
    border:1px solid var(--line); position:relative; transition:transform .12s, box-shadow .2s, border-color .2s;
    box-shadow:var(--shadow); overflow:visible; display:flex; flex-direction:column; flex-shrink:0;
  }
  .card .band{ height:6px; width:100%; border-radius:11px 11px 0 0; }
  .card .inner{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; position:relative; background:var(--panel); overflow:hidden; }
  .card .topfill{ position:absolute; top:0; left:0; right:0; height:56px; opacity:.55; pointer-events:none; }
  .card .num{ position:absolute; top:3px; left:6px; font-size:10px; color:#c4cbdb; font-weight:800; z-index:1; }
  .card .sym{ font-size:30px; font-weight:900; line-height:1; letter-spacing:-1px; color:#f4f7fc; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  .card .nm{ font-size:11px; color:#d3d9e6; font-weight:700; margin-top:2px; z-index:1; }
  .card .pv{ font-size:8px; color:#9aa4ba; font-weight:600; line-height:1.15; margin-top:3px; min-height:19px; text-align:center; padding:0 2px; z-index:1; }
  .card .stats{ display:flex; justify-content:space-between; padding:4px 7px; border-top:1px solid rgba(255,255,255,.08); background:#171d28; border-radius:0 0 11px 11px; }
  .card .atk{ color:#ff9d6b; font-weight:900; font-size:14px; }
  .card .atk.buff{ color:#ffcb47; }
  .card .hp{ color:#5ee89a; font-weight:900; font-size:14px; }
  .card .cost{ position:absolute; top:-7px; right:-7px; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#3a2c00; font-size:13px; font-weight:900; line-height:26px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,.18); z-index:2; }
  .card .cost.reduced{ background:var(--hp); color:#04240f; }
  .card .taunt{ position:absolute; top:-8px; left:-6px; font-size:17px; z-index:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
  .card .battery-badge{ position:absolute; top:-8px; left:-8px; background:#fbbf24; color:#3a2c00; font-size:11px; font-weight:900; padding:2px 5px; border-radius:10px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .card .laststand-badge{ position:absolute; top:-8px; left:-8px; font-size:15px; z-index:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .card .rad-badge{ position:absolute; top:-8px; right:-8px; background:#a3e635; color:#1a2e05; font-size:10px; font-weight:900; padding:2px 5px; border-radius:10px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .card .reflect-badge{ position:absolute; top:-8px; left:-8px; background:#e2e8f0; color:#1e293b; font-size:11px; font-weight:900; padding:2px 5px; border-radius:10px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .card .lead-badge{ position:absolute; top:14px; right:-8px; background:#64748b; color:#fff; font-size:10px; font-weight:900; padding:2px 5px; border-radius:10px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .card .tag{ font-size:8px; font-weight:800; color:#dbe0ea; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:2px 7px; border-radius:8px; white-space:nowrap; }

  /* 하단 고정 능력 툴팁 (카드 위치와 무관, 절대 안 잘림) */
  #hovertip{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(10px); max-width:90vw; background:#0e1420; border:1.5px solid var(--line); border-radius:12px; padding:11px 18px; box-shadow:var(--shadow-lg); z-index:130; opacity:0; visibility:hidden; transition:opacity .15s, transform .15s; pointer-events:none; display:flex; flex-direction:column; gap:3px; align-items:center; text-align:center; }
  #hovertip.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
  #hovertip .ht-name{ font-size:14px; font-weight:800; color:#f4f7fc; }
  #hovertip .ht-name.active{ color:#fb923c; }
  #hovertip .ht-desc{ font-size:12.5px; color:#c4cbdb; line-height:1.45; }

  .card.ready{ border-color:var(--me); cursor:pointer; box-shadow:0 0 0 2px var(--me), 0 0 14px rgba(91,155,247,.45), var(--shadow); transform:translateY(-2px); }
  .card.ready:hover{ transform:translateY(-6px); box-shadow:0 0 0 2px var(--me), 0 0 20px rgba(91,155,247,.6), var(--shadow-lg); }
  .card.selected{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold), 0 0 18px rgba(245,195,68,.55), var(--shadow-lg); transform:translateY(-6px); }
  .card.targetable{ border-color:var(--en); cursor:pointer; box-shadow:0 0 0 2px var(--en), 0 0 14px rgba(244,117,122,.45), var(--shadow); }
  .card.targetable-heal{ border-color:var(--hp); cursor:pointer; box-shadow:0 0 0 2px var(--hp), 0 0 14px rgba(74,222,128,.45), var(--shadow); }
  .card.targetable-heal:hover{ transform:translateY(-4px); }
  .card.targetable:hover{ transform:translateY(-4px); box-shadow:0 0 0 2px var(--en), 0 0 20px rgba(244,117,122,.6), var(--shadow-lg); }
  .card.dim{ opacity:.5; filter:grayscale(.55) brightness(.72); transform:translateY(2px); }
  .card.affordable{ cursor:pointer; }
  .card.affordable:hover{ transform:translateY(-6px); box-shadow:var(--shadow-lg); }
  .card.notafford{ opacity:.45; filter:grayscale(.5) brightness(.7); }

  .hand-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-top:12px; box-shadow:var(--shadow); }
  .hand-scroll{ display:flex; gap:10px; overflow-x:auto; padding:8px 6px; min-height:140px; align-items:center; }
  .hand-scroll::-webkit-scrollbar{ height:8px; }
  .hand-scroll::-webkit-scrollbar-thumb{ background:#cfd6e2; border-radius:4px; }
  .center{ text-align:center; }
  .controls{ display:flex; justify-content:center; gap:10px; margin-top:14px; }

  #log{ margin-top:14px; height:96px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--ink-soft); line-height:1.6; box-shadow:var(--shadow); }
  #log div{ padding:1px 0; }

  /* ---------- 큰 이펙트 메시지 ---------- */
  #fx-layer{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:100; }
  .fx{ font-size:46px; font-weight:900; letter-spacing:-1px; padding:16px 34px; border-radius:18px; background:rgba(30,37,50,.95); box-shadow:var(--shadow-lg); opacity:0; transform:scale(.7); }
  .fx.show{ animation:fxpop .9s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes fxpop{
    0%{ opacity:0; transform:scale(.6) translateY(10px); }
    18%{ opacity:1; transform:scale(1.05) translateY(0); }
    72%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(.96) translateY(-14px); }
  }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#0b0f17; color:#fff; border:1px solid var(--line); padding:11px 20px; border-radius:22px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:120; box-shadow:var(--shadow-lg); }
  .toast.show{ opacity:.95; }

  /* ---------- 승패 ---------- */
  #result{ text-align:center; padding-top:44px; }
  #result h1{ font-size:52px; }
  .reward-box{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; max-width:320px; margin:22px auto; box-shadow:var(--shadow); }
  .reward-choices{ display:flex; gap:16px; justify-content:center; margin:24px auto; flex-wrap:wrap; }
  .reward-pick{ background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; transition:transform .12s, border-color .2s, box-shadow .2s; }
  .reward-pick:hover{ transform:translateY(-6px); border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), var(--shadow-lg); }
  .reward-desc{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; max-width:120px; line-height:1.4; }
  .ver{ text-align:center; color:#aab2c2; font-size:11px; margin-top:10px; }
  .save-status{ text-align:center; font-size:11px; margin-top:4px; color:var(--ink-soft); }
  .settings-box{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; max-width:400px; margin:20px auto; box-shadow:var(--shadow); }

  /* ===== 뽑기 ===== */
  .gacha-currency{ display:flex; gap:20px; justify-content:center; margin:16px 0; font-size:14px; color:#5eead4; }
  .unlock-banner{ background:linear-gradient(135deg, #1a2436, #241a20); border:2px solid #fbbf24; border-radius:14px; padding:16px 20px; max-width:420px; margin:14px auto; font-size:15px; font-weight:800; color:#fbbf24; line-height:1.5; box-shadow:0 0 16px rgba(251,191,36,.3); }
  /* 튜토리얼 안내창 */
  #tuto-guide{ position:fixed; left:50%; top:14px; transform:translateX(-50%); width:min(92vw,560px); background:#0e1420; border:2px solid var(--me); border-radius:14px; padding:14px 16px 12px; z-index:150; box-shadow:0 0 24px rgba(91,155,247,.4); }
  /* 보스 화면깨짐 */
  #boss-glitch{ position:fixed; inset:0; z-index:300; background:#000; display:flex; align-items:center; justify-content:center; animation:glitch-flicker .2s steps(2) infinite; }
  #boss-glitch .glitch-text{ font-size:28px; font-weight:900; color:#a3e635; text-shadow:3px 0 #ff003c, -3px 0 #00fff9; animation:glitch-shake .15s infinite; text-align:center; }
  @keyframes glitch-flicker{ 0%{opacity:1;} 50%{opacity:.6;} 100%{opacity:1;} }
  @keyframes glitch-shake{ 0%{transform:translate(0);} 25%{transform:translate(-4px,2px);} 50%{transform:translate(4px,-2px);} 75%{transform:translate(-2px,-3px);} 100%{transform:translate(2px,3px);} }
  #tuto-guide{ transition:opacity .35s ease, transform .35s ease; }
  #tuto-guide.tuto-hide{ opacity:0; transform:translateX(-50%) translateY(-10px); }
  .card.tuto-pick{ animation:tuto-pulse 1.1s ease-in-out infinite; }
  @keyframes tuto-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(127,179,255,.0); } 50%{ box-shadow:0 0 0 5px rgba(127,179,255,.85); } }
  #tuto-clear{ position:fixed; inset:0; background:rgba(5,8,14,.78); z-index:160; display:flex; align-items:center; justify-content:center; }
  #tuto-clear .box{ background:#0e1420; border:2px solid var(--me); border-radius:16px; padding:24px 22px; text-align:center; width:min(86vw,380px); box-shadow:0 0 30px rgba(91,155,247,.45); animation:core-pop .4s ease; }
  #tuto-clear h2{ margin:0 0 8px; font-size:22px; }
  #tuto-clear p{ margin:0 0 18px; color:var(--ink-soft); font-size:14px; line-height:1.6; }
  #tuto-guide .tuto-text{ font-size:14.5px; color:#e4e8f0; line-height:1.6; text-align:center; }
  #tuto-guide .tuto-text b{ color:#7fb3ff; }
  #tuto-guide{ padding-right:40px !important; }
  #tuto-guide .tuto-x{ position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:#1a2233; color:#e4e8f0; font-size:15px; font-weight:900; line-height:1; padding:0; cursor:pointer; }
  #tuto-guide .tuto-skip{ display:block; margin:10px auto 0; background:transparent; color:var(--ink-soft); border:1px solid var(--line); border-radius:8px; padding:5px 12px; font-size:11px; font-weight:700; }
  .gacha-currency b{ color:#fff; }
  .gacha-box{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; max-width:400px; margin:0 auto; box-shadow:var(--shadow); }
  /* 친구 대결 */
  .code-box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; max-width:400px; margin:16px auto; box-shadow:var(--shadow); }
  /* 스테이지 맵 */
  .stage-map{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:460px; margin:18px auto; }
  .map-cell{ position:relative; width:80px; height:80px; border-radius:14px; background:var(--panel); border:2px solid var(--line); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:transform .12s, border-color .2s; box-shadow:var(--shadow); }
  .map-cell:hover{ transform:translateY(-4px); border-color:var(--me); }
  .map-cell.cleared{ border-color:var(--hp); }
  .map-cell.boss{ border-color:#a3e635; background:linear-gradient(135deg,#1a2410,#241a20); }
  .map-cell.locked{ opacity:.4; cursor:not-allowed; border-style:dashed; }
  .map-cell .map-num{ font-size:24px; font-weight:900; }
  .map-cell .map-label{ font-size:10px; color:var(--ink-soft); margin-top:2px; }
  .map-cell .map-check{ position:absolute; top:-6px; right:-6px; background:var(--hp); color:#06281a; font-size:12px; font-weight:900; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .code-text{ font-size:26px; font-weight:900; letter-spacing:3px; color:#a78bfa; background:#0e1420; border-radius:10px; padding:14px; word-break:break-all; }
  .code-input{ width:100%; font-size:22px; font-weight:800; letter-spacing:2px; text-align:center; text-transform:uppercase; padding:14px; border-radius:10px; border:2px solid var(--line); background:#0e1420; color:#a78bfa; box-sizing:border-box; }
  .code-input:focus{ outline:none; border-color:#a78bfa; }
  .ace-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  .ace-pick{ position:relative; cursor:pointer; border-radius:12px; padding:4px; transition:transform .12s; }
  .ace-pick:hover{ transform:translateY(-3px); }
  .ace-pick.on{ box-shadow:0 0 0 3px #fbbf24, 0 0 14px rgba(251,191,36,.5); border-radius:12px; }
  .ace-star{ position:absolute; top:-8px; right:-4px; font-size:18px; z-index:2; }
  .win-cert{ background:linear-gradient(135deg,#1a1830,#2a1a30); border:2px solid #a78bfa; border-radius:16px; padding:20px; max-width:400px; margin:16px auto; box-shadow:0 0 20px rgba(167,139,250,.3); }
  .win-deck{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  #gacha-anim{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:200; cursor:pointer; overflow:hidden; }
  .proton-counter{ position:fixed; top:24px; left:24px; font-size:36px; font-weight:900; color:#fb923c; z-index:210; }
  .proton-field{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .proton{ position:absolute; width:16px; height:16px; border-radius:50%; left:50%; top:50%; box-shadow:0 0 8px currentColor; animation:proton-in .6s ease-in forwards; }

  .dex-cell.picked{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); }
  .dex-num{ font-size:6px; color:var(--ink-soft); position:absolute; top:1px; left:2px; }
  .dex-sym{ font-size:12px; font-weight:800; color:var(--ink); }
  .dex-check{ position:absolute; bottom:0; right:1px; font-size:8px; color:var(--gold); font-weight:900; }

  .dd-card button{ margin-left:14px; margin-right:14px; }

// 덱 공유 코드 시스템 (암호 방식: 덱이 안 보이는 짧은 코드)
// ============================================================
// 원소 6종 + 에이스를 숫자로 바꿔 뒤섞은 뒤 문자로 → 알아볼 수 없는 코드
// 원소 기호를 고정 순서 배열의 인덱스로 (이 배열 순서만 유지하면 코드 안정)
const CODE_ELEMENTS = ["H","He","Li","C","N","O","Na","Mg","Al","P","Cl","K","Ca","Fe","Au","Hg","U","Ag","Pb","Es","Ar","B"];
// 코드에 쓸 문자 (헷갈리는 0 O 1 I L 뺌)
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // 30자
const CODE_SCRAMBLE = 7; // 뒤섞기용 값

// 덱(원소 key 6개) + 에이스 → 암호 코드
function encodeDeck(keys, aceKey){
  const idxs = keys.map(k=>CODE_ELEMENTS.indexOf(k)).filter(i=>i>=0);
  if(idxs.length===0) return "";
  const aceIdx = aceKey ? CODE_ELEMENTS.indexOf(aceKey) : 30; // 에이스 없으면 30(=없음 표시)
  // 6종 정렬(순서 감춤) 후 각 인덱스를 뒤섞어 문자로
  const sorted = [...idxs].sort((a,b)=>a-b);
  let nums = sorted.map(i => (i + CODE_SCRAMBLE) % CODE_CHARS.length);
  // 에이스도 뒤섞어 추가
  nums.push((aceIdx + CODE_SCRAMBLE) % CODE_CHARS.length);
  // 체크섬 (잘못된 코드 거르기)
  const sum = idxs.reduce((a,b)=>a+b,0) + aceIdx;
  nums.push(sum % CODE_CHARS.length);
  // 숫자들을 문자로
  return nums.map(n=>CODE_CHARS[n]).join("");
}

// 암호 코드 → { keys, aceKey } 또는 null(잘못된 코드)
function decodeDeck(code){
  if(!code || typeof code !== "string") return null;
  code = code.trim().toUpperCase().replace(/\s/g,"");
  if(code.length < 3) return null; // 최소 원소1 + 에이스 + 체크섬
  // 문자를 숫자로
  const nums = [];
  for(const c of code){
    const n = CODE_CHARS.indexOf(c);
    if(n < 0) return null; // 문자표에 없는 글자 = 잘못된 코드
    nums.push(n);
  }
  const checksum = nums.pop();     // 마지막 = 체크섬
  const aceScr = nums.pop();       // 그 앞 = 에이스
  // 원소 인덱스 복원 (뒤섞기 역연산)
  const idxs = nums.map(n => (n - CODE_SCRAMBLE + CODE_CHARS.length) % CODE_CHARS.length);
  for(const i of idxs){ if(i < 0 || i >= CODE_ELEMENTS.length) return null; }
  // 에이스 복원
  let aceIdx = (aceScr - CODE_SCRAMBLE + CODE_CHARS.length) % CODE_CHARS.length;
  let aceKey = null;
  if(aceIdx !== 30){
    if(aceIdx < 0 || aceIdx >= CODE_ELEMENTS.length) return null;
    aceKey = CODE_ELEMENTS[aceIdx];
  }
  // 체크섬 검증
  const sum = (idxs.reduce((a,b)=>a+b,0) + aceIdx) % CODE_CHARS.length;
  if(sum !== checksum) return null; // 잘못된 코드
  const keys = idxs.map(i=>CODE_ELEMENTS[i]);
  return { keys, aceKey };
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeCard(key){ const e=ELEMENTS[key]; return { iid:uid(), key, ...e, curHp:e.hp, maxHp:e.hp, canAttack:false, hasAttacked:false }; }
function buildDeck(keys){ const d=[]; keys.forEach(k=>{ const c=ELEMENTS[k].cost; const copies=c<=2?3:2; for(let i=0;i<Math.min(copies,MAX_COPIES);i++) d.push(k); }); return shuffle(d.map(makeCard)); }

// 플레이어가 실제로 쓸 덱 종류 결정
function activeDeckKeys(){
  // 짠 덱이 있고 정확히 6종류면 그걸 사용
  if(deckKeys && deckKeys.length===DECK_TYPES) return deckKeys;
  // 아니면 보유 원소로 자동 (6개 이하일 때)
  return owned.slice(0, DECK_TYPES);
}
// 플레이어 덱: 각 종류 3장씩
function buildPlayerDeck(){
  const keys = activeDeckKeys();
  const d=[];
  keys.forEach(k=>{ for(let i=0;i<DECK_COPIES;i++) d.push(k); });
  return shuffle(d.map(makeCard));
}
// 덱 짜기가 필요한 상태인지 (7개 이상인데 6종류 덱을 안 짬)
function needsDeck(){
  return owned.length > DECK_TYPES && !(deckKeys && deckKeys.length===DECK_TYPES);
}

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1400); }

function elName(name){
  if(useOldNames && OLD_NAMES[name]) return OLD_NAMES[name];
  return name;
}
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
}
// freq: 음높이, dur: 길이(초), type: 파형, vol: 볼륨
function beep(freq, dur, type="sine", vol=0.15){
  if(!soundOn) return;
  initAudio();
  if(!audioCtx) return;
  try{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function saveGame(){
  if(!saveAvailable) return;
  try{
    const data = { owned, deckKeys, stage, maxStage, soundOn, useOldNames, mole, crystal, gachaUnlocked, clearedStages, gachaCount, showLog, tutoDone, v:1 };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  if(!saveAvailable) return false;
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.owned) owned = data.owned;
    if(data.deckKeys !== undefined) deckKeys = data.deckKeys;
    if(data.stage) stage = data.stage;
    if(data.maxStage) maxStage = data.maxStage; else maxStage = stage;
    if(!STAGES[stage]) stage = 1;  // 범위 벗어난 저장값 방어
    if(data.soundOn !== undefined) soundOn = data.soundOn;
    if(data.mole !== undefined) mole = data.mole;
    if(data.crystal !== undefined) crystal = data.crystal;
    if(data.gachaUnlocked !== undefined) gachaUnlocked = data.gachaUnlocked;
    if(data.clearedStages !== undefined) clearedStages = data.clearedStages;
    if(data.gachaCount !== undefined) gachaCount = data.gachaCount;
    if(data.showLog !== undefined) showLog = data.showLog;
    if(data.tutoDone !== undefined) tutoDone = data.tutoDone;
    if(data.useOldNames !== undefined) useOldNames = data.useOldNames;
    return true;
  }catch(e){ return false; }
}
function clearSave(){
  if(!saveAvailable) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}

// 패시브 계산
function effAtk(card, field){
  // 헬륨(불활성)이나 공격력 0 카드는 반응/버프를 받지 않음
  if(card.atk===0 || card.passive?.kind==="lastStand") return card.atk;
  // 아르곤: 상대 필드에 아르곤이 살아 있으면 산소의 연소 지원(allyAtkUp)이 작동 안 함
  let foeField = null;
  if(G){ if(field===G.me.field) foeField=G.en.field; else if(field===G.en.field) foeField=G.me.field; }
  const argonBlocked = foeField && foeField.some(c=>c.passive?.kind==="argon");
  let a=card.atk;
  if(!argonBlocked){ field.forEach(c=>{ if(c.iid!==card.iid && c.passive?.kind==="allyAtkUp") a+=c.passive.value; }); }
  return a;
}
function shieldFor(card, field){ let s=0; field.forEach(c=>{ if(c.iid!==card.iid && c.passive?.kind==="shield") s+=c.passive.value; }); return s; }
function costOf(card, field){
  if(card.passive?.kind==="hbomb" && G && ((field===G.me.field && G.me.hbombReady) || (field===G.en.field && G.en.hbombReady))) return 0;
  let reduce=0; field.forEach(c=>{ if(c.passive?.kind==="costDown") reduce+=c.passive.value; }); return Math.max(1, card.cost - reduce); }
function tauntTargets(field){ const t=field.filter(c=>c.passive?.kind==="taunt"); return t.length? t : field; }

  const code = encodeDeck(keys, null); // 에이스 없음 (코드 구조는 그대로)

function copyCode(code){
  // 1) 최신 클립보드 API 시도
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      toast("코드를 복사했어요! 📋");
    }).catch(()=>{
      fallbackCopy(code);
    });
  } else {
    fallbackCopy(code);
  }
}
// 구식 복사 방법 (파일/미리보기 환경 대비)
function fallbackCopy(code){
  try{
    const ta = document.createElement("textarea");
    ta.value = code;
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok) toast("코드를 복사했어요! 📋");
    else toast("복사가 안 돼요. 코드를 직접 입력해주세요");
  }catch(e){

// 뽑기 실행
function doGacha(){
  if(mole < GACHA_COST){ toast("코인이 부족해요"); return; }
  mole -= GACHA_COST;
  gachaCount++;
  // 뽑기 풀 = 우라늄(보스 전용) 제외 모든 원소
  const allKeys = Object.keys(ELEMENTS).filter(k=>!SPECIAL_KEYS.includes(k));
  const notOwned = allKeys.filter(k=>!owned.includes(k));

  let key;
  // 첫 2번은 새 원소 확정 (안 가진 게 있으면)
  if(gachaCount <= 2 && notOwned.length > 0){
    key = notOwned[(Math.random()*notOwned.length)|0];
  } else {
    // 안 가진 원소는 2배 가중치
    const weighted = [];
    allKeys.forEach(k=>{
      weighted.push(k);
      if(!owned.includes(k)) weighted.push(k); // 한 번 더 넣어서 2배
    });
    key = weighted[(Math.random()*weighted.length)|0];
  }

  const isNew = !owned.includes(key);
  if(isNew){ owned.push(key); }
  else { crystal += 1; }
  saveGame();
  playGachaAnim(key, isNew);
}

// 양성자 모이는 연출 (목탁 리듬: 처음 느리게 → 점점 빠르게, 60넘으면 촤라락)
function playGachaAnim(key, isNew){
  const e = ELEMENTS[key];
  const total = e.number;
  const g = gColor(e);

  document.getElementById("app").innerHTML = `
    <div id="gacha-anim" onclick="skipGacha()">
      <div class="proton-counter" id="proton-counter">0</div>
      <div class="light-pillar" id="light-pillar"></div>
      <div class="proton-field" id="proton-field"></div>
      <div class="proton-core" id="proton-core"></div>
      <div class="gacha-flash" id="gacha-flash"></div>
      <div class="gacha-skip">화면을 누르면 건너뛰기</div>
    </div>`;

  gachaResult = { key, isNew };
  gachaSkipped = false;
  const field = document.getElementById("proton-field");
  const counter = document.getElementById("proton-counter");
  let count = 0;

  // 하나의 양성자 생성
  function spawnProton(){
    const p = document.createElement("div");
    p.className = "proton";
    p.style.background = g.band;
    p.style.boxShadow = `0 0 10px ${g.band}`;
    const angle = Math.random()*Math.PI*2;
    const dist = 220 + Math.random()*160;
    p.style.setProperty("--sx", Math.cos(angle)*dist+"px");
    p.style.setProperty("--sy", Math.sin(angle)*dist+"px");
    field.appendChild(p);
    // 사라지지 않고 중앙에 남아 쌓임
  }
  // 다음 양성자까지의 간격 (목탁 리듬)
  function nextInterval(n){
    // 초반 2개는 겁나 느리게 (빰........ 빰......)
    if(n === 1) return 1100;
    if(n === 2) return 850;
    // 후반: 60 넘으면 확 빠르게 촤라락 (이전 방식)
    if(n >= 60) return 18;
    // 중반: 3~60번째, 부드럽게 가속
    const span = Math.max(1, Math.min(total, 60) - 2);
    const p = (n - 2) / span;
    const eased = p * p;
    return Math.max(55, 450 - eased*395);
  }

  function step(){
    if(gachaSkipped) return;
    count++;
    counter.textContent = count;
    spawnProton();
    if(count >= total){
      setTimeout(()=>{ if(!gachaSkipped) risePillar(); }, 400);
      return;
    }
    gachaTimer = setTimeout(step, nextInterval(count));
  }
  gachaTimer = setTimeout(step, 400); // 첫 양성자 전 살짝 뜸
}
let gachaResult = null, gachaTimer = null, gachaSkipped = false;

  const field = document.getElementById("proton-field");
  if(field){ field.style.transition = "opacity .5s"; field.style.opacity = "0"; }
  if(pillar){
    pillar.style.background = `linear-gradient(to top, ${g.band}, transparent)`;
    pillar.style.boxShadow = `0 0 60px 20px ${g.band}`;

// 새 코드는 여기에 추가: "코드": { key:원소, msg:안내 }
const REDEEM_CODES = {
  "홍보감사아인": { key:"Es", msg:"홍보해 줘서 고마워요! 아인슈타이늄을 받았어요 💣" },
};
function redeemCode(){
  const el = document.getElementById("redeem-input");
  if(!el) return;
  const code = el.value.replace(/\s/g,"");  // 띄어쓰기 전부 무시
  if(!code){ toast("코드를 입력해 주세요"); return; }
  // 치트: 뱅뱅코인[숫자] → 그 숫자만큼 코인 지급
  const coinM = code.match(/^뱅뱅코인(\d+)$/);
  if(coinM){
    const amt = parseInt(coinM[1],10);
    mole = amt; saveGame(); SFX.win();
    toast(`코인 ${amt}개! 🪙`); el.value=""; return;
  }
  // 치트: 뱅뱅스테[숫자] / 뱅뱅스테이지[숫자] → 최대 진도를 그 번호로 정확히 맞춤(낮추기도 가능)
  const stageM = code.match(/^뱅뱅스테(?:이지)?(\d+)$/);
  if(stageM){
    const n = parseInt(stageM[1],10);
    if(n<1 || n>MAX_STAGE || !STAGES[n]){ toast(`스테이지는 1부터 ${MAX_STAGE}까지 있어요`); el.value=""; return; }
    stage = n; maxStage = n;   // 큰 쪽만 남기지 않고 정확히 맞춤. clearedStages는 그대로
    saveGame(); SFX.win();
    toast(`${n}스테이지로 이동했어요!`); el.value=""; return;
  }
  // 치트: 뱅뱅원소[원소이름] → 그 원소 지급 (ELEMENTS 전체에서 이름으로 찾음, 소듐/나트륨·포타슘/칼륨 둘 다)
  const elemM = code.match(/^뱅뱅원소(.+)$/);
  if(elemM){
    const typed = elemM[1];
    const key = Object.keys(ELEMENTS).find(k=>{
      const base = ELEMENTS[k].name;
      return base===typed || OLD_NAMES[base]===typed;
    });
    if(!key){ toast("없는 코드예요"); el.value=""; return; }
    if(owned.includes(key)){ toast("이미 가지고 있는 원소예요"); el.value=""; return; }
    owned.push(key); saveGame(); SFX.win();
    toast(`${elName(ELEMENTS[key].name)} 획득!`); el.value=""; return;
  }
  const r = REDEEM_CODES[code];
  if(!r){ toast("없는 코드예요"); el.value=""; return; }
  if(owned.includes(r.key)){ toast("이미 받은 원소예요"); el.value=""; return; }
  owned.push(r.key);
  saveGame();
  SFX.win();
  toast(r.msg);
  el.value="";
}

  }

    <div style="text-align:center; padding-top:16px;">
      <h1 style="font-size:26px;">🗺️ 스테이지 선택</h1>
      <p class="subtitle" style="font-size:13px;">깬 스테이지를 다시 해서 코인을 벌 수 있어요</p>

// 특정 스테이지 플레이 (진행도는 안 건드림)
function playSpecificStage(s){
  if(needsDeck()){ toast("먼저 덱을 짜주세요!"); showDex(); return; }
  const unlocked = clearedStages[s] || s<=maxStage;
  if(!unlocked){ toast("아직 잠긴 스테이지예요"); return; }
  stage = s;          // 도전 스테이지만 바꾸고
  saveGame();
  showTitle();        // 로비로 — "전투 시작"을 누르면 이 스테이지가 시작됨
}

// ============================================================
// 도감 + 덱 짜기 화면
// ============================================================
let dexPick = [];       // 도감에서 임시로 고른 원소들
let dexDetail = null;   // 상세창에 띄운 원소 key

function showDex(){
  // 임시 선택 초기화: 기존 덱이 있으면 그걸로, 없으면 보유원소(6개 이하면 다)
  if(deckKeys && deckKeys.length===DECK_TYPES) dexPick = [...deckKeys];
  else dexPick = owned.slice(0, DECK_TYPES);
  dexDetail = null;
  renderDex();
}

function renderDex(){
  // 주기율표 그리드 만들기 (10행 x 18열)
  let cells = "";
  // 셀 위치 맵
  const posMap = {};
  DEX.forEach(d=>{ posMap[d[3]+"-"+d[4]] = d; });

  for(let row=1; row<=10; row++){
    for(let col=1; col<=18; col++){
      const d = posMap[row+"-"+col];
      if(row===8){ cells += `<div class="dex-gap"></div>`; continue; } // 8행은 섬과 본체 사이 빈 줄
      if(!d){ cells += `<div class="dex-empty"></div>`; continue; }
      const key = d[1];
      const have = owned.includes(key);
      const picked = dexPick.includes(key);
      const playable = !!ELEMENTS[key]; // 게임 스탯 있는 원소
      let cls = "dex-cell";
      if(!have) cls += " locked";
      else { cls += " owned"; if(picked) cls += " picked"; }
      const g = playable ? gColor(ELEMENTS[key]) : null;
      const bandStyle = (have && g) ? `style="border-top:3px solid ${g.band}"` : "";
      cells += `<div class="${cls}" ${bandStyle} ${have?`onclick="openDexDetail('${key}')"`:""}>
        <div class="dex-num">${d[0]}</div>
        <div class="dex-sym">${key}</div>
        ${picked?`<div class="dex-check">✓</div>`:""}
      </div>`;
    }
  }

  const detail = dexDetail ? dexDetailHTML(dexDetail) : `<div class="dex-hint">원소를 눌러 정보를 보고<br>덱에 장착하세요</div>`;
  const count = dexPick.length;
  const canSave = count===DECK_TYPES;
  const autoMode = owned.length <= DECK_TYPES;

  document.getElementById("app").innerHTML = `
    <div class="dex-top">
      <button class="btn-ghost" onclick="showTitle()">← 뒤로</button>
      <div class="dex-title">📖 원소 도감</div>
      <div class="dex-counter ${canSave?'ok':''}">${autoMode?`보유 ${owned.length}종`:`덱 ${count}/${DECK_TYPES}`}</div>
    </div>
    <div class="dex-layout">
      <div class="dex-grid">${cells}</div>
      <div class="dex-side">${detail}</div>
    </div>
    ${autoMode
      ? `<div class="dex-save-row"><div style="color:var(--ink-soft);font-size:13px;">원소가 6개 이하라 모두 자동으로 덱에 들어가요</div></div>`
      : `<div class="dex-save-row">
           <button class="${canSave?'btn-primary':'btn-disabled'}" ${canSave?'onclick="saveDeck()"':'disabled'}>덱 저장 (${count}/${DECK_TYPES})</button>
         </div>`}`;
}

function openDexDetail(key){
  dexDetail = key;
  renderDex();
}

function dexDetailHTML(key){
  const d = DEX_MAP[key];
  const e = ELEMENTS[key]; // 게임 스탯 (있을 수도)
  const picked = dexPick.includes(key);
  const g = e ? gColor(e) : {band:"#94a3b8"};

  let statLine = "", skillLine = "", btn = "";
  if(e){
    statLine = `<div class="dd-stat">⚡ ${e.cost} · ⚔ ${e.atk} · ❤ ${e.hp}</div>`;
    if(e.passive) skillLine = `<div class="dd-skill">✨ <b>${e.passive.short}</b><br>${e.passive.label}</div>`;
    else if(e.active) skillLine = `<div class="dd-skill">💥 <b>${e.active.short}</b><br>${e.active.label}</div>`;
    else skillLine = `<div class="dd-skill" style="color:var(--ink-soft)">특별한 능력이 없어요</div>`;
    // 장착 버튼
    if(owned.length <= DECK_TYPES){
      btn = `<div style="color:var(--ink-soft);font-size:12px;margin-top:8px;">자동으로 덱에 포함돼요</div>`;
    } else if(picked){
      btn = `<button class="btn-danger" style="margin-top:10px;" onclick="unpick('${key}')">덱에서 빼기</button>`;
    } else {
      btn = `<button class="btn-primary" style="margin-top:10px;" onclick="pick('${key}')">덱에 넣기</button>`;
    }
  } else {
    statLine = `<div class="dd-stat" style="color:var(--ink-soft)">아직 게임에 없는 원소예요</div>`;
  }

  return `<div class="dd-card">
    <div class="dd-band" style="background:${g.band}"></div>
    <div class="dd-head">
      <span class="dd-sym">${key}</span>
      <div><div class="dd-name">${elName(d.name)}</div><div class="dd-num">${d.number}번</div></div>
    </div>
    ${statLine}
    ${skillLine}
    <div class="dd-desc">🧪 ${d.desc}</div>
    ${btn}
  </div>`;
}

function pick(key){
  if(dexPick.includes(key)) return;
  if(dexPick.length >= DECK_TYPES){ toast(`${DECK_TYPES}종류까지만 넣을 수 있어요`); return; }
  dexPick.push(key);
  renderDex();
}
function unpick(key){
  dexPick = dexPick.filter(k=>k!==key);
  renderDex();
}
function saveDeck(){
  if(dexPick.length !== DECK_TYPES){ toast(`${DECK_TYPES}종류를 채워주세요`); return; }
  deckKeys = [...dexPick];
  saveGame();
  toast("덱을 저장했어요! ⚔️");
  showTitle();
}

// 단계: 1=수소소환 2=턴종료 3=(상대수소)산소설명 4=공격 5=실전전환 6~=자유+철질소
function startTutorial(){
  UID = 1;
  tutoStep = 1;
  // 고정 세팅: 내 손패 수소 위주, 상대 약하게

  const myLeft = { H:1, O:2, N:2 };
  const myDeck = buildDeck(["H","O","N"]).filter(c => myLeft[c.key]-- > 0);
  // 상대 손패에 수소가 꼭 있게 고정 (첫 턴에 수소를 내야 튜토리얼이 진행됨)
  const enDeck = [makeCard("H"),makeCard("O"),makeCard("H"),makeCard("N")];
  G = { turn:"me", turnCount:1, botMiss:0, tutorial:true,
    me:{ hp:25, energy:1, maxEnergy:1, deck:myDeck, hand:myHand, field:[] },
    en:{ hp:20, maxHp:20, energy:1, maxEnergy:1, deck:enDeck.slice(2), hand:enDeck.slice(0,2), field:[] },
  };
  logs = []; sel={hand:null,attacker:null,mode:null}; busy=false;
  renderBattle();
  showTutoGuide();
}

// 단계별 안내 문구
function tutoGuideText(){

    case 1: return "⚡ 에너지가 1이에요. <b>수소</b>(비용 1)만 낼 수 있어요.<br>손패의 <b>수소를 누르고 → '소환하기'</b>를 눌러봐요!";

      ? "💡 카드를 <b>꾹 누르면</b> 능력을 볼 수 있어요.<br>방금 낸 <b>산소</b>를 꾹 눌러보면 '연소 지원' 능력이 보여요!"
      : "💡 카드에 <b>마우스를 갖다대면</b> 능력을 볼 수 있어요.<br>방금 낸 <b>산소</b>에 갖다대 보면 '연소 지원' 능력이 보여요!";
    case 5: return "산소 덕분에 수소가 세졌어요(공격 1→2)!<br>이제 <b>수소를 누르고 → 상대 수소를 눌러</b> 공격해봐요.";
    case 6: return "<b>튜토리얼 2스테이지</b>예요!<br>특별히 <b>에너지 6</b>부터 시작해요! ⚡<br>카드를 꺼내서 상대와 맞서봐요!";
    case 7: return "저 앞의 <b>철</b>은 벽처럼 막아줘요(철부터 없애야 해요).<br>뒤의 <b>질소</b>는 아군을 지키는 카드예요. 산소로 강해진 카드로 철을 공격해봐요!";
    case 8: return tutoCanAttack()
      ? "철이 사라졌어요! 🎉<br>이제 <b>뒤에 있던 질소</b>를 공격해봐요!"
      : "이번 턴엔 공격할 카드가 없어요.<br><b>'턴 종료'</b>를 눌러 다음 턴에 질소를 공격해봐요!";
    case 9: return tutoCanAttack()
      ? "좋아요! 상대 카드를 다 없앴어요. 🎉<br>이제 <b>상대 본체</b>를 직접 공격해서 체력을 0으로 만들면 승리! 💪"
      : "이번 턴엔 공격할 카드가 없어요.<br><b>'턴 종료'</b>를 눌러 다음 턴에 상대 본체를 공격해봐요!";

function showTutoGuide(){
  let box = document.getElementById("tuto-guide");
  if(!box){
    box = document.createElement("div");
    box.id = "tuto-guide";
    document.body.appendChild(box);
  }
  const txt = tutoGuideText();
  if(!txt){ box.style.display="none"; return; }
  box.style.display="block";
  const html = `<button class="tuto-x" onclick="tutoCloseGuide()" aria-label="닫기">✕</button>
    <div class="tuto-text">${txt}</div>`;
  if(!box.innerHTML){ box.innerHTML = html; return; }
  box.classList.add("tuto-hide");
  const step = tutoStep;
  setTimeout(()=>{
    if(tutoStep!==step || !document.getElementById("tuto-guide")) return;
    box.innerHTML = html;
    box.classList.remove("tuto-hide");
  }, 380);
}
// ✕ 누르면: 안내만 닫힘. 다음 상황이 되면 다음 안내가 다시 뜸
function tutoCloseGuide(){
  const box = document.getElementById("tuto-guide");
  if(box){ box.style.display="none"; box.innerHTML=""; }
}
// 안내 따르지 않는 행동 막기 (1~5단계). 막으면 힌트 문구, 허용이면 null
// what: "summon" | "pickHand" | "attacker" | "attack" | "face" | "endTurn" | "active"
function tutoBlock(what, card){
  if(!G || !G.tutorial) return null;
  const step = tutoStep;
  if(step===1){
    if((what==="summon"||what==="pickHand") && card?.key==="H") return null;
    return "수소를 소환해봐요! 💧";
  }
  if(step===2){
    if(what==="endTurn") return null;
    return "'턴 종료'를 눌러볼까요? ⏭️";
  }
  if(step===3){
    if((what==="summon"||what==="pickHand") && card?.key==="O") return null;
    return "산소를 내볼까요? 🔥";
  }
  if(step===4){
    return isPhone() ? "산소 카드를 꾹 눌러서 능력을 확인해봐요! 🔥" : "산소 카드에 마우스를 갖다대 봐요! 🔥";
  }
  if(step===5){
    if(what==="attacker" && card?.key==="H") return null;
    if(what==="attack") return null;
    return "수소로 상대 수소를 공격해봐요! ⚔️";
  }
  if(step===8){
    // 철 잡은 뒤: 질소를 공격하게 (본체는 아직 막음)
    if(what==="attacker") return null;
    if(what==="face") return "아직 질소가 남아 있어요. 질소를 먼저 공격해봐요!";
    if(what==="attack") return null;
    if(what==="endTurn") return tutoCanAttack() ? "뒤에 있던 질소를 공격해봐요!" : null; // 칠 카드 없으면 턴 종료 허용
    return "뒤에 있던 질소를 공격해봐요!";
  }
  if(step===9){
    // 질소까지 잡은 뒤: 본체만 치게
    if(what==="attacker") return null;
    if(what==="face") return null;
    if(what==="attack") return "앞에 막는 카드가 없어요. 상대 본체를 공격해봐요! 💥";
    if(what==="endTurn") return tutoCanAttack() ? "상대 본체를 공격해봐요! 💥" : null; // 칠 카드 없으면 턴 종료 허용
    return "상대 본체를 공격해봐요! 💥";
  }
  return null;
}
function isPhone(){ return window.innerWidth < 700; }
// 지금 내 턴에 공격할 수 있는 카드가 하나라도 있나
function tutoCanAttack(){
  return !!(G && G.me.field.some(c=>c.canAttack && !c.hasAttacked));
}
// 지금 단계에서 내야 하는 카드 (그 외 카드는 못 냄)
function tutoMustKey(){
  if(!G || !G.tutorial) return null;
  if(tutoStep===1) return "H";
  if(tutoStep===3) return "O";
  return null;
}
function hideTutoGuide(){
  const box = document.getElementById("tuto-guide");
  if(box) box.remove();
}

// 튜토리얼 단계 진행 (액션 후 호출)
function tutoAdvance(action){
  if(!G || !G.tutorial) return;
  if(tutoStep===1 && action==="summon"){ tutoStep=2; setTimeout(()=>{ if(tutoStep===2) showTutoGuide(); }, 900); }
  else if(tutoStep===3 && action==="summon"){ // 산소 소환함
    tutoStep=4; setTimeout(()=>{ if(tutoStep===4) showTutoGuide(); }, 900);
  }
  else if(tutoStep===5 && action==="attack"){ tutoStep=6; setTimeout(showTutoStage1Clear, 1400); }
  else if(tutoStep===6 && action==="summon"){ tutoStep=7; setTimeout(()=>{ if(tutoStep===7) showTutoGuide(); }, 900); }
}

// 상대 턴 끝난 뒤 튜토리얼 진행
function tutoAfterEnemyTurn(){
  if(tutoStep===2){ tutoStep=3; renderBattle(); setTimeout(()=>{ if(tutoStep===3) showTutoGuide(); }, 900); } // 상대 수소 낸 뒤 → 산소 소환 유도
}

// 기초 끝: "튜토리얼 1스테이지 클리어!" 창 → [다음] 눌러야 2스테이지

  busy=true;
  hideTutoGuide();

      <p class="subtitle">소환하기, 턴 넘기기, 공격하기를 다 해냈어요!</p>
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <button class="btn-primary" onclick="tutoToRealPhase()">다음으로 →</button></div>
      <div class="ver">v0.23</div></div>`;
  }, 900);

// 2스테이지: 에너지 6, 상대 철·질소 등장
function tutoToRealPhase(){
  if(!G) return;
  busy=false;
  G.me.maxEnergy=6; G.me.energy=6;
  G.me.field = [];  // 내 필드 비우고 시작
  G.me.hand = [makeCard("O"), makeCard("H"), makeCard("H"), makeCard("N")];  // 다시 꺼낼 카드
  // 덱도 3장 규칙에 맞춰 새로: 각 원소 3장에서 손패에 든 만큼 뺌 (H2·O1·N1 들었으니 덱엔 H1·O2·N2)
  { const left = { H:1, O:2, N:2 };
    G.me.deck = buildDeck(["H","O","N"]).filter(c => left[c.key]-- > 0); }
  G.en.field.push({...makeCard("Fe"), canAttack:false, hasAttacked:false});
  G.en.field.push({...makeCard("N"), canAttack:false, hasAttacked:false});
  renderBattle();
  fx("튜토리얼 2스테이지", "#3b82f6");
  const box = document.getElementById("tuto-guide");
  if(box){ box.style.display="block"; box.innerHTML=""; }
  showTutoGuide(); // "2스테이지예요! 에너지 6부터" — 공격 카드 고르면 철·질소 안내
}

function skipTutorial(){
  hideTutoGuide();
  const ov = document.getElementById("tuto-clear"); if(ov) ov.remove();
  tutoStep=0;
  G=null; busy=false;
  finishTutorial(true); // 건너뛰어도 철 지급? — 아래에서 결정
}

// 튜토리얼 전용 봇 턴 (봐주기)
async function tutoEnemyTurn(){
  await wait(600);
  if(!G) return;
  G.en.field.forEach(c=>{ c.canAttack=true; c.hasAttacked=false; });

  // 1~5단계: 상대 수소 하나만 냄 (아직 없으면), 공격 안 함
  if(tutoStep <= 5){
    if(G.en.field.length===0){
      const h = G.en.hand.find(c=>c.key==="H") || makeCard("H"); // 혹시 없으면 만들어서 냄
      if(h){
        G.en.hand = G.en.hand.filter(c=>c.iid!==h.iid);
        G.en.field.push({...h, canAttack:false, hasAttacked:false});
        log("🔶 상대가 수소를 냈어요");
      }
    }
    // 공격 안 함 (봐주기)
  } else {
    // 6단계 이후: 철은 공격 안 함, 질소만 공격, 내 체력 5 이하면 안 때림
    for(const c of G.en.field){
      if(!G) return;
      if(c.hasAttacked) continue;
      if(c.key==="Fe") continue;              // 철은 공격 안 함
      if(G.me.hp <= 5) continue;              // 봐주기: 내 체력 낮으면 안 때림
      if(G.me.field.length===0){
        // 내 필드 비면 본체 살짝 (약하게)
        if(G.me.hp > 5){ G.me.hp -= 1; log(`💥 상대 공격! 본체 -1`); renderBattle(); flashHp("me"); }
      } else {
        await wait(500);
        if(!G) return;
        const t = G.me.field[0];
        t.curHp -= effAtk(c, G.en.field);
        if(t.curHp<=0){ G.me.field = G.me.field.filter(x=>x.iid!==t.iid); }
        c.hasAttacked=true;
        renderBattle();
      }
    }
  }
  await wait(500);
  if(!G) return;
  // 내 턴으로
  G.me.maxEnergy = Math.min(MAX_ENERGY, G.me.maxEnergy+1); G.me.energy = G.me.maxEnergy;
  drawFor(G.me, "당신");
  G.me.field.forEach(c=>{ c.canAttack=true; c.hasAttacked=false; });
  G.turn="me"; G.turnCount++; busy=false;
  renderBattle();
  fx("내 턴!", "#3b82f6");
  showTutoGuide();  // 새 턴이 되면 안내 문구 갱신 (예: 질소 공격 가능해지면 바뀜)
  tutoAfterEnemyTurn();
}

// 카드 렌더
// ============================================================
function cardHTML(c, ctx, field){
  const e = c; const g = gColor(e);
  const eff = effAtk(c, field||[]); const buff = eff > c.atk;
  const taunt = c.passive?.kind==="taunt" ? `<div class="taunt">🧲</div>` : "";
  // 리튬 충전 표시 (필드에서, 충전값 있을 때)
  let battery = "";
  if(ctx!=="hand" && c.active?.kind==="battery" && !c.batteryDone){
    battery = `<div class="battery-badge">🔋${c.charge||0}</div>`;
  }
  // 헬륨 불활성 남아있음 표시
  let lastStand = "";
  if(ctx!=="hand" && c.passive?.kind==="lastStand" && !c.lastStandUsed){
    lastStand = `<div class="laststand-badge">✨</div>`;
  }
  // 방사능 오염 표시
  let rad = "";
  if(ctx!=="hand" && c.radTurns > 0){
    rad = `<div class="rad-badge">☢️${c.radTurns}</div>`;
  }
  // 은 반사: 모은 피해 표시
  let reflect = "";
  if(ctx!=="hand" && c.active?.kind==="reflect"){
    reflect = `<div class="reflect-badge">🪞${c.reflectStore||0}</div>`;
  }
  // 납 축적독: 독이 쌓인 카드 표시
  let lead = "";
  if(ctx!=="hand" && (c.leadStacks||0) > 0){
    lead = `<div class="lead-badge">☠️${c.leadStacks}</div>`;
  }
  let cls="card", onclick="", cost="";

  if(ctx==="hand"){
    const realCost = costOf(c, G.me.field);
    const afford = G.turn==="me" && !busy && realCost<=G.me.energy && G.me.field.length<FIELD_MAX;
    cls += afford? " affordable":" notafford";
    if(sel.hand===c.iid) cls+=" selected";
    const must = tutoMustKey();
    if(must && c.key===must && G.turn==="me") cls+=" tuto-pick";
    if(afford || (G.tutorial && tutoStep>=1 && tutoStep<=5 && G.turn==="me")) onclick=`onclick="pickHand(${c.iid})"`;
    cost = `<div class="cost ${realCost!==c.cost?'reduced':''}">${realCost}</div>`;
  } else if(ctx==="my-field"){
    // 회복 모드: 내 카드가 회복 대상
    if(sel.mode==="heal" && c.iid!==sel.srcIid){
      cls+=" targetable-heal"; onclick=`onclick="healTarget(${c.iid})"`;
    } else {
      const ready = G.turn==="me" && !busy && c.canAttack && !c.hasAttacked;
      if(ready) cls+=" ready"; if(sel.attacker===c.iid) cls+=" selected";
      if(!ready && sel.attacker!==c.iid) cls+=" dim";
      if(ready) onclick=`onclick="pickAttacker(${c.iid})"`;
    }
  } else { // enemy-field
    if(sel.mode==="reflect"){
      if(tauntTargets(G.en.field).map(x=>x.iid).includes(c.iid)){
        cls+=" targetable"; onclick=`onclick="reflectTarget(${c.iid})"`;
      }
    } else if(sel.mode==="lead"){
      if(c.passive?.kind!=="immune"){
        cls+=" targetable"; onclick=`onclick="leadTarget(${c.iid})"`;
      }
    } else if(sel.mode==="blast"){
      // 발화 모드: 상대 카드가 발화 대상 (도발 지킴)
      if(tauntTargets(G.en.field).map(x=>x.iid).includes(c.iid)){
        cls+=" targetable"; onclick=`onclick="blastTarget(${c.iid})"`;
      }
    } else {
      let targetable=false;
      if(G.turn==="me" && !busy && sel.attacker!=null){
        const atkC = G.me.field.find(x=>x.iid===sel.attacker);
        // 수은 침투: 도발 무시하고 아무나 공격 가능
        if(atkC && atkC.passive?.kind==="infiltrate"){
          targetable = true;
        } else {
          targetable = tauntTargets(G.en.field).map(x=>x.iid).includes(c.iid);
        }
      }
      if(targetable){ cls+=" targetable"; onclick=`onclick="attackTarget(${c.iid})"`; }
    }
  }

  const atkShow = (ctx==="hand") ? c.atk : eff;
  const hpShow  = (ctx==="hand") ? c.hp  : c.curHp;
  const tag = (ctx==="my-field" && !(G.turn==="me"&&!busy&&c.canAttack&&!c.hasAttacked) && sel.attacker!==c.iid)
      ? `<div class="tag">${c.hasAttacked?"공격완료":(c.canAttack?"":"대기중")}</div>` : "";

  // 능력 정보 → 마우스 올리면 하단 고정 툴팁에 표시
  let hover = "";
  if(e.passive){
    hover = `onmouseenter="showTip('${e.passive.short}','${e.passive.label}',false)" onmouseleave="hideTip()"`;
  } else if(e.active){
    hover = `onmouseenter="showTip('${e.active.short}','${e.active.label}',true)" onmouseleave="hideTip()"`;
  }

  return `<div class="${cls}" ${onclick} ${hover}>
    ${cost}${taunt}${battery}${lastStand}${rad}${reflect}${lead}
    <div class="band" style="background:${g.band}"></div>
    <div class="inner">
      <div class="topfill" style="background:linear-gradient(180deg, ${g.band}, transparent)"></div>
      <div class="num">${e.number}</div>
      <div class="sym">${e.symbol}</div>
      <div class="nm">${elName(e.name)}</div>
      <div class="pv">${e.passive?("✨ "+e.passive.short):(e.active?("💥 "+e.active.short):"")}</div>
      ${tag}
    </div>
    <div class="stats">
      <span class="atk ${buff?'buff':''}">⚔ ${atkShow}</span>
      <span class="hp">❤ ${hpShow}</span>
    </div>
  </div>`;
}

// 하단 고정 툴팁
function showTip(name, desc, isActive){
  if(G && G.tutorial && tutoStep===4 && name===ELEMENTS.O.passive.short){
    tutoStep=5; showTutoGuide(); renderBattle();
  }
  const t = document.getElementById("hovertip");
  if(!t) return;
  t.innerHTML = `<span class="ht-name ${isActive?'active':''}">${isActive?'💥':'✨'} ${name}</span><span class="ht-desc">${desc}</span>`;
  t.classList.add("show");
}
function hideTip(){
  const t = document.getElementById("hovertip");
  if(t) t.classList.remove("show");
}

function renderBattle(){
  if(!G) return;
  syncReflect();
  hideTip();
  const myTurn = G.turn==="me" && !busy;
  const enField = G.en.field.length? G.en.field.map(c=>cardHTML(c,"enemy-field",G.en.field)).join("") : `<div class="empty">비어 있음</div>`;
  const myField = G.me.field.length? G.me.field.map(c=>cardHTML(c,"my-field",G.me.field)).join("") : `<div class="empty">비어 있음</div>`;
  const hand = G.me.hand.map(c=>cardHTML(c,"hand",G.me.field)).join("");
  let faceBtn = "";
  if(myTurn && sel.mode==="reflect"){
    if(G.en.field.length===0){
      faceBtn = `<button class="btn-danger" onclick="reflectFace()">🪞 본체에 반사!</button>`;
    }
  } else if(myTurn && sel.mode==="blast"){
    // 발화 모드: 상대 카드 없으면 본체 발화 버튼
    if(G.en.field.length===0){
      faceBtn = `<button class="btn-danger" onclick="blastFace()">🔥 본체에 발화!</button>`;
    }
  } else if(myTurn && sel.attacker!=null){
    const sc = G.me.field.find(c=>c.iid===sel.attacker);
    const canFace = G.en.field.length===0 || (sc && sc.passive?.kind==="infiltrate");
    if(canFace && sc && sc.canAttack && !sc.hasAttacked){
      faceBtn = `<button class="btn-danger" onclick="attackFace()">상대 본체 공격 💥</button>`;
    }
  }
  // 선택된 카드가 액티브 스킬 보유 시 스킬 버튼
  let activeBtn = "";
  if(myTurn && sel.attacker!=null){
    const sc = G.me.field.find(c=>c.iid===sel.attacker);
    if(sc && sc.active && sc.active.kind==="battery"){
      // 리튬: 방출 안 했고 충전이 있으면 버튼 (소환턴에도 가능)
      if(!sc.batteryDone){
        const ch = sc.charge||0;
        if(ch>0){
          activeBtn = `<button class="btn-active" onclick="useActive(${sc.iid})">🔋 방출 (+${ch})</button>`;
        } else {
          activeBtn = `<button class="btn-disabled" disabled>🔋 충전 중... (${sc.chargeTick||0}/2)</button>`;
        }
      }
    } else if(sc && sc.active && sc.active.kind==="reflect" && sc.canAttack){
      // 은: 여러 번 사용 가능 (한 턴에 한 번), 모은 피해가 있어야 함
      const st = sc.reflectStore||0;
      if(sc.reflectTurn===G.turnCount){
        activeBtn = `<button class="btn-disabled" disabled>🪞 이번 턴엔 반사함</button>`;
      } else if(st<=0){
        activeBtn = `<button class="btn-disabled" disabled>🪞 모은 피해 없음</button>`;
      } else {
        activeBtn = `<button class="btn-active" onclick="useActive(${sc.iid})">🪞 반사 ${st} (⚡${sc.active.energy})</button>`;
      }
    } else if(sc && sc.active && sc.active.kind==="leadPoison" && sc.canAttack){
      // 납: 대상 바꾸기 가능 (한 턴에 한 번)
      if(sc.leadTurn===G.turnCount){
        activeBtn = `<button class="btn-disabled" disabled>☠️ 이번 턴엔 독을 걸었어요</button>`;
      } else {
        const has = G.en.field.some(t=>t.iid===sc.leadTarget);
        activeBtn = `<button class="btn-active" onclick="useActive(${sc.iid})">☠️ ${has?"대상 바꾸기":"축적독"} (⚡${sc.active.energy})</button>`;
      }
    } else if(sc && sc.active && !sc.usedActive && sc.canAttack){
      const iconMap = { poison:"☠️", heal:"💚", blast:"🔥", aoe:"💥", stun:"✨" };
      const icon = iconMap[sc.active.kind] || "✨";
      if(sc.active.kind==="poison" && poisonActive(G.me.field)){
        activeBtn = `<button class="btn-disabled" disabled>☠️ 이미 독가스 퍼짐</button>`;
      } else {
        activeBtn = `<button class="btn-active" onclick="useActive(${sc.iid})">${icon} ${sc.active.short} (⚡${sc.active.energy})</button>`;
      }
    }
  }
  // 스킬 대상 고르는 중(반사·축적독·회복·발화)이면 취소 버튼
  let cancelBtn = "";
  if(myTurn && (sel.mode==="reflect"||sel.mode==="lead"||sel.mode==="heal"||sel.mode==="blast")){
    cancelBtn = `<button class="btn-ghost" onclick="cancelSkill()">취소</button>`;
  }

  const summonBtn = (sel.hand!=null)
    ? `<div class="center" style="margin-top:4px;"><button class="btn-primary" onclick="doSummon()">소환하기</button></div>` : "";

  const enPct = Math.max(0,Math.min(100,G.en.hp/(G.en.maxHp||START_HP)*100));
  const mePct = Math.max(0,Math.min(100,G.me.hp/START_HP*100));

  // 다시 그려도 손패 스크롤 위치·화면 위치 유지 (폰에서 맨 앞으로 튕기는 문제)
  const oldHand = document.querySelector(".hand-scroll");
  const handScroll = oldHand ? oldHand.scrollLeft : 0;
  const pageY = window.scrollY;
  document.getElementById("app").innerHTML = `
    <div class="stage-bar">
      <span>${
        G.versus ? "🤝 친구 대결"
        : G.tutorial ? `🎓 튜토리얼 ${tutoStep>=6?"2":"1"}스테이지`
        : G.boss ? `${stage}스테이지 보스 ☢️${G.bossPhase===2?" 2페이즈":""}`
        : "🏆 "+STAGES[stage].label
      }　·　턴 ${G.turnCount}</span>
      ${G.tutorial ? "" : `<button class="exit-btn" onclick="confirmExit()">✕ 나가기</button>`}
    </div>
    <div class="zone en ${G.turn==='en'?'active-en':''}">
      <div class="pbar">
        <div class="who en">상대</div>
        <div class="hpwrap"><div class="hpfill" id="hp-en" style="width:${enPct}%;background:var(--en)"></div>
          <div class="hptext">❤️ ${Math.max(0,G.en.hp)} / ${G.en.maxHp||START_HP}</div></div>
      </div>
      <div class="field-label">상대 필드${poisonActive(G.me.field)?" ☠️ 독안개":""}</div>
      <div class="field-row${poisonActive(G.me.field)?" poison-fog":""}">${enField}</div>
    </div>

    <div class="mid">${faceBtn} ${activeBtn} ${cancelBtn}</div>

    <div class="zone me ${myTurn?'active-me':''}">
      <div class="field-label">내 필드 ${myTurn?"— 공격할 카드를 누르세요":""}${poisonActive(G.en.field)?" ☠️ 독안개":""}</div>
      <div class="field-row${poisonActive(G.en.field)?" poison-fog":""}">${myField}</div>
      <div class="pbar">
        <div class="who me">나</div>
        <div class="hpwrap"><div class="hpfill" id="hp-me" style="width:${mePct}%;background:var(--me)"></div>
          <div class="hptext">❤️ ${Math.max(0,G.me.hp)} / ${START_HP}</div></div>
        <div class="stat-mini e">⚡${G.me.energy}/${G.me.maxEnergy}</div>
      </div>
    </div>

    <div class="hand-wrap">
      <div class="field-label">내 손패 — 소환할 카드를 누르세요 (에너지 ⚡${G.me.energy}/${G.me.maxEnergy})</div>
      <div class="hand-scroll">${hand}</div>
      ${summonBtn}
    </div>

    <div class="controls">
      <button class="${myTurn?'btn-primary':'btn-disabled'}" ${myTurn?'onclick="endTurn()"':'disabled'}>${G.turn==="me"?"턴 종료 ⏭️":"상대 턴..."}</button>
    </div>
    ${showLog ? '<div id="log"></div>' : ''}`;
  const newHand = document.querySelector(".hand-scroll");
  if(newHand && handScroll) newHand.scrollLeft = handScroll;
  if(window.scrollY !== pageY) window.scrollTo(0, pageY);
  const el=document.getElementById("log"); if(el){ el.innerHTML=logs.map(l=>`<div>${l}</div>`).join(""); el.scrollTop=el.scrollHeight; }
}

function flashHp(side){
  const el=document.getElementById(side==="me"?"hp-me":"hp-en");
  if(el){ el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),400); }
}

// ============================================================
// 플레이어 액션
// ============================================================
function pickHand(iid){
  if(G.turn!=="me"||busy) return;
  { const c = G.me.hand.find(x=>x.iid===iid); const b = tutoBlock("pickHand", c);
    if(b){ toast(b); sel.hand=null; renderBattle(); return; } }
  sel.hand=(sel.hand===iid)?null:iid; sel.attacker=null; renderBattle(); }
function pickAttacker(iid){
  if(G.turn!=="me"||busy) return;
  { const c = G.me.field.find(x=>x.iid===iid); const b = tutoBlock("attacker", c);
    if(b){ toast(b); sel.attacker=null; renderBattle(); return; } }
  sel.attacker=(sel.attacker===iid)?null:iid; sel.hand=null; renderBattle(); }

function doSummon(){
  if(G.turn!=="me"||busy||sel.hand==null) return;
  const card = G.me.hand.find(c=>c.iid===sel.hand); if(!card) return;
  { const b = tutoBlock("summon", card); if(b){ toast(b); return; } }
  if(G.me.field.length>=FIELD_MAX){ toast("필드가 가득 찼어요 (최대 5자리)"); return; }
  const realCost = costOf(card, G.me.field);
  if(realCost>G.me.energy){ toast("에너지가 부족해요"); return; }
  G.me.energy -= realCost;
  G.me.hand = G.me.hand.filter(c=>c.iid!==card.iid);
  const newCard = {...card, canAttack:false, hasAttacked:false};
  G.me.field.push(newCard);
  const freeBomb = card.passive?.kind==="hbomb" && realCost===0;
  if(freeBomb) G.me.hbombReady = false;
  log(`🔷 ${card.name}(${card.symbol}) 소환! ${freeBomb?"(수소폭탄으로 무료 소환!)":(realCost!==card.cost?`(탄소 촉매로 ${realCost} 소모)`:"")}`);
  fx(`${elName(card.name)} 소환!`, gColor(card).band); SFX.summon();
  onSummon(newCard, G.me);   // 등장 효과 (칼슘 등)
  sel.hand=null; renderBattle();
  if(G.tutorial) tutoAdvance("summon");
}

// 등장 시 효과 (칼슘: 체력 최고 아군 강화)
function onSummon(card, owner){
  if(card.passive?.kind==="boneUp"){
    // 자기 뺀 아군 중 현재 체력 최고 (동점이면 원소번호 빠른 애)
    const others = owner.field.filter(c=>c.iid!==card.iid);
    if(others.length===0) return;
    let best = others[0];
    others.forEach(c=>{
      if(c.curHp > best.curHp || (c.curHp===best.curHp && c.number < best.number)) best = c;
    });
    best.maxHp = (best.maxHp||best.hp) + 1;
    best.curHp += 1;
    log(`🦴 ${card.name}이(가) ${best.name}의 체력을 올려줬어요! (❤${best.curHp})`);
    fx(`🦴 ${elName(best.name)} 강화!`, "#facc15");
  }
}

function attackTarget(targetIid){
  if(G.turn!=="me"||busy||sel.attacker==null) return;
  const aCard = G.me.field.find(c=>c.iid===sel.attacker);
  const tCard = G.en.field.find(c=>c.iid===targetIid);
  if(!aCard||!tCard||!aCard.canAttack||aCard.hasAttacked) return;
  { const b = tutoBlock("attack", aCard); if(b){ toast(b); return; } }
  // 수은 침투가 아니면 도발 검사
  if(aCard.passive?.kind!=="infiltrate" && !tauntTargets(G.en.field).map(x=>x.iid).includes(targetIid)){ toast("자석 방패! 철을 먼저 공격해야 해요 🧲"); return; }
  fx(`⚔️ ${elName(aCard.name)} 공격!`, "#e0662f");
  dealToUnit(aCard, tCard, G.me.field, G.en, "상대", "en");
  aCard.hasAttacked=true; sel.attacker=null;
  if(aCard.key==="H") hbombTrigger(G.me, "당신");
  if(G && G.tutorial) tutoAdvance("attack");
  if(checkEnd())return; renderBattle();
}
function attackFace(){
  if(G.turn!=="me"||busy||sel.attacker==null) return;
  { const b = tutoBlock("face"); if(b){ toast(b); return; } }
  const aCard = G.me.field.find(c=>c.iid===sel.attacker);
  if(!aCard||!aCard.canAttack||aCard.hasAttacked) return;
  // 수은 침투가 아니면, 상대 카드 있을 때 본체 공격 불가
  if(aCard.passive?.kind!=="infiltrate" && G.en.field.length>0){ toast("상대 카드를 먼저 없애야 해요"); return; }
  const dmg = effAtk(aCard, G.me.field); G.en.hp -= dmg;
  log(`💥 ${aCard.name} → 상대 본체에 ${dmg} 데미지! (남은 ${Math.max(0,G.en.hp)})`);
  fx(`💥 본체에 ${dmg}!`, "#ef4444"); SFX.pierce();
  aCard.hasAttacked=true; sel.attacker=null;
  if(aCard.key==="H") hbombTrigger(G.me, "당신");
  renderBattle(); flashHp("en");
  if(checkEnd())return;
}
function dealToUnit(aCard, tCard, atkField, defP, defName, defSide){
  let dmg = effAtk(aCard, atkField);
  const shield = shieldFor(tCard, defP.field);
  const realDmg = Math.max(0, dmg - shield);
  if(shield>0) log(`🛡️ 신선 보존! ${tCard.name} 데미지 ${shield} 감소`);
  // 우라늄 접촉 오염: 공격자가 우라늄이면 대상 오염 / 대상이 우라늄이면 공격자 오염
  if(aCard.passive?.kind==="radiation") contaminate(tCard);
  if(tCard.passive?.kind==="radiation") contaminate(aCard);
  const before = tCard.curHp; tCard.curHp -= realDmg;
  if(tCard.curHp<=0){
    // 헬륨 불활성: 죽을 데미지를 딱 한 번 체력 1로 버팀 (관통도 막음)
    if(tCard.passive?.kind==="lastStand" && !tCard.lastStandUsed){
      tCard.lastStandUsed = true;
      tCard.curHp = 1;
      log(`✨ 불활성! ${tCard.name}이(가) 체력 1로 버텼어요`);
      fx(`✨ ${tCard.name} 불활성!`, "#a78bfa");
      return;  // 관통 없음, 완전 방어
    }
    log(`☠️ ${defName}의 ${tCard.name} 파괴됨!`);
    onCardDeath(tCard, defP, aCard);  // 죽을 때 효과(리튬, 마그네슘 섬광 등)
    defP.field = defP.field.filter(c=>c.iid!==tCard.iid);
    const overflow = boronReduce(realDmg - before, defP.field); // 죽은 카드 제외한 필드의 붕소로 감소
    if(overflow>0){ defP.hp -= overflow; log(`➡️ 관통! 넘친 ${overflow} 데미지가 본체로 (남은 ${Math.max(0,defP.hp)})`); fx(`💥 관통 ${overflow}!`, "#ef4444"); SFX.pierce(); setTimeout(()=>flashHp(defSide),60); }
    else { fx(`☠️ ${tCard.name} 파괴`, "#6b7280"); SFX.hit(); }
  } else {
    log(`⚔️ ${aCard.name} → ${tCard.name}에게 ${realDmg} 데미지 (남은 ${tCard.curHp})`); SFX.hit();
  }
}

// 우라늄 오염 걸기 (재오염 안 함: 이미 오염된 카드는 무시)
function contaminate(card){
  if(!card) return;
  if(card.radTurns > 0) return;      // 이미 오염됨 → 갱신 안 함
  if(card.passive?.kind==="radiation") return; // 우라늄끼리는 오염 안 됨
  if(card.passive?.kind==="immune"){ log(`✨ ${card.name}은(는) 방사능도 튕겨냈어요!`); return; } // 금 면역
  card.radTurns = 2;
  log(`☢️ ${card.name}이(가) 방사능에 오염됐어요! (2턴간 매턴 2씩)`);
  fx(`☢️ ${elName(card.name)} 오염!`, "#a3e635");
}

// 카드가 죽을 때 효과
function onCardDeath(card, owner, killer){
  // 튜토리얼: 앞을 막던 상대 철이 사라지면 본체 공격 안내로
  if(G && G.tutorial && tutoStep===7 && owner===G.en && card.key==="Fe"){
    tutoStep=8; setTimeout(()=>{ if(tutoStep===8) showTutoGuide(); }, 500);
  }
  if(G && G.tutorial && tutoStep===8 && owner===G.en && card.key==="N"){
    tutoStep=9; setTimeout(()=>{ if(tutoStep===9) showTutoGuide(); }, 500);
  }
  // 오염된 카드가 3턴 전에 죽으면 남은 피해가 본체로
  if(card.radTurns > 0){
    const dmg = card.radTurns * 2;
    owner.hp -= dmg;
    log(`☢️ ${card.name}의 남은 방사능이 본체로! ${dmg} 피해`);
    fx(`☢️ 방사능이 본체로 ${dmg}!`, "#a3e635"); SFX.pierce();
    const side = (G && owner===G.me) ? "me" : "en";
    setTimeout(()=>flashHp(side), 60);
  }
}

// 액티브 스킬 발동 (나트륨 물 폭발)
function useActive(iid){
  if(G.turn!=="me"||busy) return;
  { const b = tutoBlock("active"); if(b){ toast(b); return; } }
  const card = G.me.field.find(c=>c.iid===iid);
  if(!card || !card.active) return;
  const act = card.active;
  if(act.kind==="reflect"){
    syncReflect();
    if(card.reflectTurn===G.turnCount){ toast("반사는 한 턴에 한 번만 쓸 수 있어요"); return; }
    if((card.reflectStore||0)<=0){ toast("아직 모은 피해가 없어요"); return; }
    if(act.energy > G.me.energy){ toast(`에너지가 부족해요 (필요 ⚡${act.energy})`); return; }
    sel = { hand:null, attacker:null, mode:"reflect", srcIid:iid };
    toast(G.en.field.length===0 ? "본체에 반사할 수 있어요!" : "반사할 상대를 골라요");
    renderBattle();
    return;
  }
  if(act.kind==="leadPoison"){
    if(card.leadTurn===G.turnCount){ toast("축적독은 한 턴에 한 번만 걸 수 있어요"); return; }
    if(act.energy > G.me.energy){ toast(`에너지가 부족해요 (필요 ⚡${act.energy})`); return; }
    if(!G.en.field.some(t=>t.passive?.kind!=="immune")){ toast("독을 걸 상대 카드가 없어요"); return; }
    sel = { hand:null, attacker:null, mode:"lead", srcIid:iid };
    toast("독을 쌓을 상대를 골라요");
    renderBattle();
    return;
  }
  if(card.usedActive){ toast("이미 이 카드의 스킬을 썼어요"); return; }
  if(act.energy > G.me.energy){ toast(`에너지가 부족해요 (필요 ⚡${act.energy})`); return; }
  if(act.kind==="aoe"){
    if(G.en.field.length===0){ toast("폭발시킬 상대 카드가 없어요"); return; }
    G.me.energy -= act.energy;
    card.usedActive = true;
    fx(`💥 ${elName(card.name)} 물 폭발!`, "#fb923c"); SFX.explode();
    log(`💥 ${card.name} 물 폭발! 상대 전체에 ${act.value} 데미지`);
    // 상대 전체에 데미지 (관통 없음, 단순 광역)
    const targets = [...G.en.field];
    targets.forEach(t=>{
      t.curHp -= act.value;
      if(t.curHp<=0){ log(`☠️ 상대의 ${t.name} 파괴됨!`); }
    });
    G.en.field = G.en.field.filter(t=>t.curHp>0);
  } else if(act.kind==="stun"){
    // 마그네슘 섬광: 상대 카드 전체 다음 턴 공격 불가
    if(G.en.field.length===0){ toast("섬광을 비출 상대 카드가 없어요"); return; }
    G.me.energy -= act.energy;
    card.usedActive = true;
    G.en.field.forEach(t=>{ t.flashStunned = true; });
    fx(`✨ ${elName(card.name)} 섬광!`, "#facc15"); SFX.explode();
    log(`✨ ${card.name} 섬광! 상대 카드 전체가 다음 턴 공격할 수 없어요`);
  } else if(act.kind==="poison"){
    G.me.energy -= act.energy;
    card.usedActive = true;
    card.poisonOn = true;   // 이 염소가 상대에게 독을 켠 주체
    fx(`☠️ ${elName(card.name)} 독가스!`, "#4ade80"); SFX.poison();
    log(`☠️ ${card.name} 독가스! 상대 전체가 매 턴 ${act.value}씩 중독돼요`);
  } else if(act.kind==="battery"){
    // 리튬 방출: 충전한 만큼 에너지 획득, 이후 충전 정지
    const charged = card.charge || 0;
    if(charged <= 0){ toast("아직 충전된 에너지가 없어요"); return; }
    G.me.energy += charged;   // 최대치(6) 초과 허용
    card.charge = 0;
    card.batteryDone = true;  // 이후 충전 안 함
    card.usedActive = true;
    fx(`🔋 ${elName(card.name)} 방출! +${charged}`, "#fbbf24"); SFX.summon();
    log(`🔋 ${card.name}이(가) 에너지 ${charged}를 방출했어요! (현재 ⚡${G.me.energy})`);
  } else if(act.kind==="heal"){
    // 칼륨 회복: 아군 하나 선택 (대상 선택 모드)
    if(G.me.field.length<=1){ toast("회복할 아군이 없어요"); return; }
    sel = { hand:null, attacker:null, mode:"heal", srcIid:iid };
    toast("회복할 아군을 골라요");
    renderBattle();
    return;
  } else if(act.kind==="blast"){
    // 인 발화: 대상 선택 모드 (상대 카드 없으면 본체 발화 버튼이 뜸)
    sel = { hand:null, attacker:null, mode:"blast", srcIid:iid };
    toast(G.en.field.length===0 ? "본체에 발화할 수 있어요!" : "발화로 태울 상대를 골라요");
    renderBattle();
    return;
  }
  sel={hand:null,attacker:null,mode:null};
  if(checkEnd())return; renderBattle();
}

// 칼륨 회복: 아군 대상 클릭
function healTarget(iid){
  if(G.turn!=="me"||busy||sel.mode!=="heal") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  const tgt = G.me.field.find(c=>c.iid===iid);
  if(!src||!tgt) return;
  if(src.active.energy > G.me.energy){ toast("에너지가 부족해요"); sel={hand:null,attacker:null,mode:null}; renderBattle(); return; }
  const maxHp = tgt.maxHp||tgt.hp;
  if(tgt.curHp>=maxHp){ toast("이미 체력이 가득해요"); return; }
  G.me.energy -= src.active.energy;
  tgt.curHp = Math.min(maxHp, tgt.curHp + src.active.value);
  log(`💚 ${src.name}이(가) ${tgt.name}의 체력을 회복시켰어요 (❤${tgt.curHp})`);
  fx(`💚 ${elName(tgt.name)} 회복!`, "#4ade80"); SFX.summon();
  sel={hand:null,attacker:null,mode:null}; renderBattle();
}
// ===== 은 반사 =====
// 체력이 깎인 만큼 모음 (공격·독·방사능·폭발 전부). 회복은 모은 값을 줄이지 않음
function syncReflect(){
  if(!G) return;
  [G.me, G.en].forEach(P=>P.field.forEach(c=>{
    if(c.active?.kind!=="reflect") return;
    if(c.agHp===undefined){ c.agHp = c.curHp; c.reflectStore = c.reflectStore||0; return; }
    if(c.curHp < c.agHp) c.reflectStore = (c.reflectStore||0) + (c.agHp - c.curHp);
    c.agHp = c.curHp;
  }));
}
// 반사 피해 주기 (공용: 나/봇). 카드면 관통 있음, 대상 없으면 본체
function doReflect(src, tgt, defP, defName, defSide){
  const dmg = src.reflectStore||0;
  src.reflectStore = 0; src.reflectTurn = G.turnCount;
  SFX.explode();
  if(tgt){
    fx(`🪞 ${elName(src.name)} 반사 ${dmg}!`, "#e2e8f0");
    log(`🪞 ${defName==="상대"?"":"상대 "}${src.name} 반사! ${tgt.name}에게 ${dmg} 피해`);
    const before = tgt.curHp; tgt.curHp -= dmg;
    if(tgt.curHp<=0){
      if(tgt.passive?.kind==="lastStand" && !tgt.lastStandUsed){
        tgt.lastStandUsed=true; tgt.curHp=1;
        log(`✨ 불활성! ${tgt.name}이(가) 버텼어요`);
      } else {
        log(`☠️ ${defName}의 ${tgt.name} 파괴됨!`);
        onCardDeath(tgt, defP, src);
        defP.field = defP.field.filter(c=>c.iid!==tgt.iid);
        const overflow = boronReduce(dmg - before, defP.field);
        if(overflow>0){ defP.hp -= overflow; log(`➡️ 관통! 넘친 ${overflow} 데미지가 본체로`); setTimeout(()=>flashHp(defSide),60); }
      }
    }
  } else {
    defP.hp -= dmg;
    fx(`🪞 본체에 반사 ${dmg}!`, "#e2e8f0");
    log(`🪞 ${defName==="상대"?"":"상대 "}${src.name} 반사! ${defName} 본체에 ${dmg} 피해`);
    setTimeout(()=>flashHp(defSide), 60);
  }
}
function reflectTarget(iid){
  if(G.turn!=="me"||busy||sel.mode!=="reflect") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  const tgt = G.en.field.find(c=>c.iid===iid);
  if(!src||!tgt) return;
  if(!tauntTargets(G.en.field).map(x=>x.iid).includes(iid)){ toast("자석 방패! 철을 먼저 노려야 해요 🧲"); return; }
  if(src.active.energy > G.me.energy){ toast("에너지가 부족해요"); sel={hand:null,attacker:null,mode:null}; renderBattle(); return; }
  G.me.energy -= src.active.energy;
  doReflect(src, tgt, G.en, "상대", "en");
  sel={hand:null,attacker:null,mode:null};
  if(checkEnd())return; renderBattle();
}
// 스킬 대상 고르기 취소 (반사·축적독·회복·발화). 에너지는 대상 고를 때 쓰이므로 환불 불필요
function cancelSkill(){
  if(!(sel.mode==="reflect"||sel.mode==="lead"||sel.mode==="heal"||sel.mode==="blast")) return;
  sel = { hand:null, attacker:null, mode:null };
  toast("스킬을 취소했어요");

}
function reflectFace(){
  if(G.turn!=="me"||busy||sel.mode!=="reflect") return;
  const src = G.me.field.find(c=>c.iid===sel.srcIid);
  if(!src) return;
